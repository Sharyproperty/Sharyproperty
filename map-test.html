                    //         polygonArea,
                    //         rectangleArea:
                    //             best.area,

                    //         rectangularity,

                    //         threshold:
                    //             rectangularityThreshold
                    //     }
                    // );

                    return {
                        angleRadians: 0,
                        angleDegrees: 0,
                        mirrored: false,
                        error: 0,
                        preservedUploadOrientation: true,
                        opaquePolygonRotation: false,
                        rotationMethod: 'preserve-irregular'
                    };
                }


                /* 4. MATCH IMAGE WIDTH TO CORRECT RECTANGLE AXIS */
                const imageWidth = img.naturalWidth || img.width;
                const imageHeight = img.naturalHeight || img.height;
                const imageAspect = imageWidth / imageHeight;

                /*
                * Candidate 1:
                *
                * image width follows rectangle U.
                */
                const candidate1 = {
                    angle: best.angle,
                    width: best.width,
                    height: best.height
                };


                /*
                * Candidate 2:
                *
                * image width follows rectangle V.
                */
                const candidate2 = {
                    angle: best.angle + Math.PI / 2,
                    width: best.height,
                    height: best.width
                };

                function aspectError(candidate) {
                    const geographicAspect = candidate.width / candidate.height;

                    return Math.abs(
                        Math.log(
                            geographicAspect /
                            imageAspect
                        )
                    );
                }


                const error1 = aspectError(candidate1);
                const error2 = aspectError(candidate2);

                let selected = error1 <= error2 ? candidate1 : candidate2;
                let angle = selected.angle;

                /* 
                    5. RESOLVE 180-DEG AMBIGUITY
                    
                    We want image left -> right to generally point
                    geographic west -> east.

                    This prevents an upside-down result.
                */
                if (Math.cos(angle) < 0 ) {
                    angle += Math.PI;
                }

                /*
                * Normalize to -90° ... +90°.
                */
                while (angle > Math.PI / 2) {
                    angle -= Math.PI;
                }

                while (angle <= -Math.PI / 2) {
                    angle += Math.PI;
                }

                const degrees = angle * 180 / Math.PI;

                /* 6. RESULT */
                // console.log(
                //     'OPAQUE RECTANGULAR MASTERPLAN ALIGNMENT',
                //     {
                //         imageWidth,
                //         imageHeight,
                //         imageAspect,
                //         polygonArea,
                //         rectangleArea: best.area,
                //         rectangularity,
                //         rectangleWidth: best.width,
                //         rectangleHeight: best.height,
                //         candidate1Degrees: candidate1.angle * 180 / Math.PI,
                //         candidate1Error: error1,
                //         candidate2Degrees: candidate2.angle * 180 / Math.PI,
                //         candidate2Error: error2,
                //         selectedAngleDegrees: degrees
                //     }
                // );


                return {
                    angleRadians: angle,
                    angleDegrees: degrees,
                    mirrored: false,
                    error: Math.min(error1, error2),
                    preservedUploadOrientation: false,
                    opaquePolygonRotation: true,
                    rectangularity,
                    rotationMethod: 'minimum-rectangle-high-confidence'
                };
            }

            function lngLatToMercatorPoint(coordinate) {
                const mercator = mapboxgl.MercatorCoordinate.fromLngLat({
                    lng: coordinate[0],
                    lat: coordinate[1]
                });

                return {
                    x: mercator.x,
                    y: mercator.y
                };
            }

            function solveLinearSystem(matrix, vector) {
                const n = vector.length;

                const augmented = matrix.map((row, index) => [
                    ...row,
                    vector[index]
                ]);

                for (let column = 0; column < n; column++) {
                    /*
                    * Find strongest pivot.
                    */
                    let pivotRow = column;

                    for (let row = column + 1; row < n; row++) {
                        if (Math.abs(augmented[row][column]) > Math.abs(augmented[pivotRow][column])) {
                            pivotRow = row;
                        }
                    }

                    if (Math.abs(augmented[pivotRow][column]) < 1e-14) {
                        return null;
                    }


                    /*
                    * Swap rows.
                    */
                    [
                        augmented[column],
                        augmented[pivotRow]
                    ] = [
                        augmented[pivotRow],
                        augmented[column]
                    ];


                    /*
                    * Normalize pivot row.
                    */
                    const pivot = augmented[column][column];
                    for (let j = column; j <= n; j++) {
                        augmented[column][j] /= pivot;
                    }


                    /*
                    * Eliminate this column from other rows.
                    */
                    for (let row = 0; row < n; row++) {
                        if (row === column) {
                            continue;
                        }

                        const factor = augmented[row][column];

                        for (let j = column; j <= n; j++) {
                            augmented[row][j] -= factor * augmented[column][j];
                        }
                    }
                }


                return augmented.map(
                    row => row[n]
                );
            }

            function calculateHomography(sourcePoints, destinationPoints) {
                if (sourcePoints.length !== 4 || destinationPoints.length !== 4) {
                    return null;
                }

                const A = [];
                const B = [];

                for (let i = 0; i < 4; i++) {
                    const x = sourcePoints[i].x;
                    const y = sourcePoints[i].y;
                    const u = destinationPoints[i].x;
                    const v = destinationPoints[i].y;

                    /*
                    * U equation.
                    */
                    A.push([
                        x,
                        y,
                        1,

                        0,
                        0,
                        0,

                        -u * x,
                        -u * y
                    ]);

                    B.push(
                        u
                    );


                    /*
                    * V equation.
                    */
                    A.push([
                        0,
                        0,
                        0,

                        x,
                        y,
                        1,

                        -v * x,
                        -v * y
                    ]);

                    B.push(
                        v
                    );
                }


                const result = solveLinearSystem(A,B);

                if (!result) {
                    return null;
                }

                return [
                    result[0],
                    result[1],
                    result[2],

                    result[3],
                    result[4],
                    result[5],

                    result[6],
                    result[7],
                    1
                ];
            }

            function applyHomography(matrix, point) {
                const x =
                    point.x;

                const y =
                    point.y;


                const denominator =
                    matrix[6] * x +
                    matrix[7] * y +
                    matrix[8];


                if (Math.abs(denominator) < 1e-15) {
                    return null;
                }

                return {
                    x:
                        (
                            matrix[0] * x +
                            matrix[1] * y +
                            matrix[2]
                        ) /
                        denominator,

                    y:
                        (
                            matrix[3] * x +
                            matrix[4] * y +
                            matrix[5]
                        ) /
                        denominator
                };
            }

            function createMasterplanClippedToPolygon(img, finalCoords, boundaryPolygon) {
                if (!img || !Array.isArray(finalCoords) || finalCoords.length !== 4 || !Array.isArray(boundaryPolygon) || boundaryPolygon.length < 3) {
                    return img.src;
                }


                const width = img.naturalWidth || img.width;
                const height = img.naturalHeight || img.height;

                if (!width || !height) {
                    return img.src;
                }

                /* 1. MAPBOX IMAGE QUAD -> MERCATOR

                finalCoords must already be:

                TL
                TR
                BR
                BL

                We DO NOT modify them. 
                */
                const geographicQuad = finalCoords.map(
                    coordinate => lngLatToMercatorPoint(coordinate)
                );

                /* 2. PNG CANVAS CORNERS */
                const imageQuad = [

                    // TL
                    {
                        x: 0,
                        y: 0
                    },

                    // TR
                    {
                        x: width,
                        y: 0
                    },

                    // BR
                    {
                        x: width,
                        y: height
                    },

                    // BL
                    {
                        x: 0,
                        y: height
                    }
                ];


                /* 3. MERCATOR -> PNG PIXEL TRANSFORM */
                const homography = calculateHomography(geographicQuad, imageQuad);

                if (!homography) {
                    console.warn('Could not calculate masterplan clipping transform.');
                    return img.src;
                }


                /* 4. PROJECT POLYGON -> PNG PIXELS */
                const pixelPolygon = [];

                for (const coordinate of boundaryPolygon) {
                    /*
                    * Skip invalid coordinates.
                    */
                    if (!Array.isArray(coordinate) || coordinate.length < 2) {
                        continue; 
                    }

                    const geographicPoint = lngLatToMercatorPoint(coordinate);

                    const pixel = applyHomography(homography, geographicPoint);

                    if (pixel && Number.isFinite(pixel.x) && Number.isFinite(pixel.y)) {
                        pixelPolygon.push(pixel);
                    }
                }


                if (
                    pixelPolygon.length < 3
                ) {
                    return img.src;
                }


                /* =====================================================
                5. CREATE TRANSPARENT CANVAS
                ===================================================== */

                const canvas =
                    document.createElement(
                        'canvas'
                    );


                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext(
                        '2d'
                    );


                ctx.clearRect(
                    0,
                    0,
                    width,
                    height
                );


                /* =====================================================
                6. CLIP TO ACTUAL PROJECT POLYGON
                ===================================================== */

                ctx.save();


                ctx.beginPath();


                ctx.moveTo(
                    pixelPolygon[0].x,
                    pixelPolygon[0].y
                );


                for (
                    let i = 1;
                    i <
                    pixelPolygon.length;
                    i++
                ) {

                    ctx.lineTo(
                        pixelPolygon[i].x,
                        pixelPolygon[i].y
                    );
                }


                ctx.closePath();


                /*
                * THIS is the important line.
                *
                * Everything outside selected coordinates
                * becomes invisible.
                */
                ctx.clip();


                /*
                * Draw the ORIGINAL uploaded masterplan.
                *
                * No rotation changes.
                * No scaling changes.
                * No coordinate changes.
                */
                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                ctx.restore();


                /* =====================================================
                7. RETURN TRANSPARENT PNG
                ===================================================== */

                try {

                    return canvas.toDataURL(
                        'image/png'
                    );

                } catch (
                    error
                ) {

                    console.warn(
                        'Masterplan clipping failed:',
                        error
                    );

                    return img.src;
                }
            }
            /* =========================================================
            7. CONVERT IMAGE PIXELS TO CARTESIAN COORDS
            =========================================================

            Canvas:
                +Y goes DOWN

            Geography/local XY:
                +Y goes UP

            Therefore:
                y = -pixelY
            ========================================================= */

            function imageBoundaryToCartesianLast(points) {

                return points.map(
                    point => ({
                        x:
                            point.x,

                        y:
                            -point.y
                    })
                );
            }


            /* =========================================================
            8. RESAMPLE POINT CLOUD
            =========================================================

            Boundary can have thousands of pixels.
            We only need a manageable number for matching.
            ========================================================= */

            function samplePointCloudLast(points, targetCount = 150) {

                if (
                    !Array.isArray(points) ||
                    !points.length
                ) {
                    return [];
                }


                if (
                    points.length <=
                    targetCount
                ) {
                    return points.slice();
                }


                const step =
                    points.length /
                    targetCount;


                const sampled =
                    [];


                for (
                    let i = 0;
                    i < targetCount;
                    i++
                ) {

                    sampled.push(
                        points[
                            Math.floor(
                                i *
                                step
                            )
                        ]
                    );
                }


                return sampled;
            }


            /* =========================================================
            9. SAMPLE POLYGON EDGES UNIFORMLY
            ========================================================= */

            function samplePolygonEdgesLast(points, targetCount = 150) {

                if (
                    !Array.isArray(points) ||
                    points.length < 2
                ) {
                    return [];
                }


                /*
                * Calculate edge lengths.
                */
                const edges =
                    [];


                let totalLength =
                    0;


                for (
                    let i = 0;
                    i < points.length;
                    i++
                ) {

                    const a =
                        points[i];


                    const b =
                        points[
                            (i + 1) %
                            points.length
                        ];


                    const length =
                        Math.hypot(
                            b.x -
                                a.x,

                            b.y -
                                a.y
                        );


                    edges.push({
                        a,
                        b,
                        length
                    });


                    totalLength +=
                        length;
                }


                if (
                    totalLength <= 0
                ) {
                    return [];
                }


                const sampled =
                    [];


                const spacing =
                    totalLength /
                    targetCount;


                let distanceTarget =
                    0;


                let cumulative =
                    0;


                let edgeIndex =
                    0;


                while (
                    sampled.length <
                    targetCount &&
                    edgeIndex <
                    edges.length
                ) {

                    const edge =
                        edges[
                            edgeIndex
                        ];


                    const edgeStart =
                        cumulative;


                    const edgeEnd =
                        cumulative +
                        edge.length;


                    while (
                        distanceTarget <=
                            edgeEnd &&
                        sampled.length <
                            targetCount
                    ) {

                        const t =
                            edge.length === 0
                                ?
                                0
                                :
                                (
                                    distanceTarget -
                                    edgeStart
                                ) /
                                edge.length;


                        sampled.push({
                            x:
                                edge.a.x +
                                (
                                    edge.b.x -
                                    edge.a.x
                                ) *
                                t,

                            y:
                                edge.a.y +
                                (
                                    edge.b.y -
                                    edge.a.y
                                ) *
                                t
                        });


                        distanceTarget +=
                            spacing;
                    }


                    cumulative =
                        edgeEnd;


                    edgeIndex++;
                }


                return sampled;
            }


            /* =========================================================
            10. NORMALISE SHAPE
            =========================================================

            Translation removed.
            Uniform scale removed.
            ========================================================= */

            function normalizeShapeLast(points) {

                if (
                    !Array.isArray(points) ||
                    !points.length
                ) {
                    return {
                        points: [],
                        centerX: 0,
                        centerY: 0,
                        scale: 1
                    };
                }


                const centerX =
                    points.reduce(
                        (sum, point) =>
                            sum + point.x,
                        0
                    ) /
                    points.length;


                const centerY =
                    points.reduce(
                        (sum, point) =>
                            sum + point.y,
                        0
                    ) /
                    points.length;


                const centered =
                    points.map(
                        point => ({
                            x:
                                point.x -
                                centerX,

                            y:
                                point.y -
                                centerY
                        })
                    );


                /*
                * RMS distance gives a stable global scale.
                */
                let sumSquaredDistance =
                    0;


                for (
                    const point
                    of centered
                ) {

                    sumSquaredDistance +=
                        point.x *
                            point.x +
                        point.y *
                            point.y;
                }


                let scale =
                    Math.sqrt(
                        sumSquaredDistance /
                        centered.length
                    );


                if (
                    !Number.isFinite(scale) ||
                    scale <= 0
                ) {

                    scale =
                        1;
                }


                return {
                    centerX,
                    centerY,
                    scale,

                    points:
                        centered.map(
                            point => ({
                                x:
                                    point.x /
                                    scale,

                                y:
                                    point.y /
                                    scale
                            })
                        )
                };
            }


            /* =========================================================
            11. ROTATE SHAPE
            ========================================================= */

            function rotateShapeLast(points, angleRadians) {

                const cos =
                    Math.cos(
                        angleRadians
                    );


                const sin =
                    Math.sin(
                        angleRadians
                    );


                return points.map(
                    point => ({
                        x:
                            point.x *
                                cos -
                            point.y *
                                sin,

                        y:
                            point.x *
                                sin +
                            point.y *
                                cos
                    })
                );
            }


            /* =========================================================
            12. MIRROR SHAPE
            ========================================================= */

            function mirrorShapeXLast(points) {

                return points.map(
                    point => ({
                        x:
                            -point.x,

                        y:
                            point.y
                    })
                );
            }


            /* =========================================================
            13. NEAREST-NEIGHBOUR ERROR
            =========================================================

            Symmetric Chamfer-style distance.

            A -> B
            +
            B -> A

            More stable than only one direction.
            ========================================================= */

            function nearestPointErrorLast(source, target) {

                if (
                    !source.length ||
                    !target.length
                ) {
                    return Infinity;
                }


                let total =
                    0;


                for (
                    const sourcePoint
                    of source
                ) {

                    let bestSquared =
                        Infinity;


                    for (
                        const targetPoint
                        of target
                    ) {

                        const dx =
                            sourcePoint.x -
                            targetPoint.x;


                        const dy =
                            sourcePoint.y -
                            targetPoint.y;


                        const squared =
                            dx *
                                dx +
                            dy *
                                dy;


                        if (
                            squared <
                            bestSquared
                        ) {

                            bestSquared =
                                squared;
                        }
                    }


                    total +=
                        bestSquared;
                }


                return (
                    total /
                    source.length
                );
            }


            function calculateShapeMatchErrorLast(shapeA, shapeB) {

                const aToB =
                    nearestPointErrorLast(
                        shapeA,
                        shapeB
                    );


                const bToA =
                    nearestPointErrorLast(
                        shapeB,
                        shapeA
                    );


                return (
                    aToB +
                    bToA
                ) / 2;
            }


            /* =========================================================
            14. SEARCH BEST ROTATION
            ========================================================= */

            function searchRotationRangeLast(imageShape, geoShape, startDegrees, endDegrees, stepDegrees) {

                let bestAngleDegrees =
                    0;


                let bestError =
                    Infinity;


                for (
                    let degrees =
                        startDegrees;

                    degrees <=
                        endDegrees;

                    degrees +=
                        stepDegrees
                ) {

                    const radians =
                        degrees *
                        Math.PI /
                        180;


                    const rotated =
                        rotateShapeLast(
                            imageShape,
                            radians
                        );


                    const error =
                        calculateShapeMatchErrorLast(
                            rotated,
                            geoShape
                        );


                    if (
                        error <
                        bestError
                    ) {

                        bestError =
                            error;


                        bestAngleDegrees =
                            degrees;
                    }
                }


                return {
                    degrees:
                        bestAngleDegrees,

                    radians:
                        bestAngleDegrees *
                        Math.PI /
                        180,

                    error:
                        bestError
                };
            }


            /* =========================================================
            15. FIND BEST ROTATION
            ========================================================= */

            function findBestRotationLast(imageShape, geoShape) {

                /*
                * Stage 1:
                * coarse
                */
                const coarse =
                    searchRotationRangeLast(
                        imageShape,
                        geoShape,
                        -180,
                        180,
                        3
                    );


                /*
                * Stage 2:
                * medium
                */
                const medium =
                    searchRotationRangeLast(
                        imageShape,
                        geoShape,

                        coarse.degrees -
                            4,

                        coarse.degrees +
                            4,

                        0.5
                    );


                /*
                * Stage 3:
                * fine
                */
                const fine =
                    searchRotationRangeLast(
                        imageShape,
                        geoShape,

                        medium.degrees -
                            0.75,

                        medium.degrees +
                            0.75,

                        0.1
                    );


                return fine;
            }


            /* =========================================================
            16. FIND BEST ORIENTATION
            =========================================================

            Test:

            normal
            mirrored-X

            ========================================================= */

            function findBestShapeOrientationLast(imageShape, geoShape) {

                const normal =
                    findBestRotationLast(
                        imageShape,
                        geoShape
                    );


                const mirroredShape =
                    mirrorShapeXLast(
                        imageShape
                    );


                const mirrored =
                    findBestRotationLast(
                        mirroredShape,
                        geoShape
                    );


                if (
                    normal.error <=
                    mirrored.error
                ) {

                    return {
                        mirrored:
                            false,

                        angleDegrees:
                            normal.degrees,

                        angleRadians:
                            normal.radians,

                        error:
                            normal.error
                    };
                }


                return {
                    mirrored:
                        true,

                    angleDegrees:
                        mirrored.degrees,

                    angleRadians:
                        mirrored.radians,

                    error:
                        mirrored.error
                };
            }


            /* =========================================================
            17. EXTRACT IMAGE SHAPE
            ========================================================= */

            function extractMasterplanImageShapeLast(img, options = {}) {
                const {
                    maxMaskSize = 450,
                    alphaThreshold = 20,
                    sampleCount = 160
                } = options;

                const maskResult =
                    createAlphaMaskLast(
                        img,
                        {
                            maxSize:
                                maxMaskSize,

                            alphaThreshold
                        }
                    );

                if (!maskResult) {
                    return null;
                }

                const {
                    mask,
                    width,
                    height
                } =
                    maskResult;


                /* =====================================================
                DETECT WHETHER IMAGE REALLY HAS TRANSPARENCY
                ===================================================== */

                let visiblePixels = 0;

                const totalPixels =
                    width *
                    height;


                for (
                    let i = 0;
                    i < mask.length;
                    i++
                ) {
                    if (mask[i]) {
                        visiblePixels++;
                    }
                }


                const visibleRatio =
                    totalPixels > 0
                        ?
                        visiblePixels /
                        totalPixels
                        :
                        1;


                /*
                * Example:
                *
                * JPG:
                * visibleRatio ≈ 1.00
                *
                * Transparent PNG:
                * visibleRatio may be 0.40 / 0.60 / 0.80 etc.
                *
                * If nearly the complete canvas is visible,
                * there is no useful alpha silhouette from which
                * rotation can be determined.
                */
                const hasUsefulTransparency =
                    visibleRatio <
                    0.97;


                /* =====================================================
                LARGEST COMPONENT
                ===================================================== */

                const largestMask =
                    keepLargestConnectedComponentLast(
                        mask,
                        width,
                        height
                    );

                if (!largestMask) {
                    return null;
                }


                /* =====================================================
                BOUNDARY
                ===================================================== */

                const boundary =
                    extractBoundaryPointsLast(
                        largestMask,
                        width,
                        height
                    );

                if (
                    !boundary ||
                    boundary.length < 10
                ) {
                    return null;
                }


                const cartesian =
                    imageBoundaryToCartesianLast(
                        boundary
                    );


                const sampled =
                    samplePointCloudLast(
                        cartesian,
                        sampleCount
                    );


                if (
                    !sampled ||
                    sampled.length < 4
                ) {
                    return null;
                }


                const normalized =
                    normalizeShapeLast(
                        sampled
                    );

                // console.log(
                //     'MASTERPLAN IMAGE TYPE',
                //     {
                //         visibleRatio,

                //         hasUsefulTransparency,

                //         preserveUploadedRotation:
                //             !hasUsefulTransparency
                //     }
                // );

                return {
                    rawBoundary:
                        boundary,

                    cartesianBoundary:
                        cartesian,

                    sampled,

                    normalizedPoints:
                        normalized.points,

                    normalized,

                    maskWidth:
                        width,

                    maskHeight:
                        height,

                    componentMask:
                        largestMask,

                    sourceWidth:
                        maskResult.sourceWidth,

                    sourceHeight:
                        maskResult.sourceHeight,


                    /*
                    * NEW
                    */
                    visibleRatio,

                    hasUsefulTransparency,

                    preserveUploadedRotation:
                        !hasUsefulTransparency
                };
            }


            /* =========================================================
            18. EXTRACT GEOGRAPHIC SHAPE
            ========================================================= */

            function extractProjectPolygonShapeLast(polygon, options = {}) {

                const {
                    sampleCount = 160
                } = options;


                const projected =
                    projectPolygonToLocalMetersLast(
                        polygon
                    );


                if (!projected) {
                    return null;
                }


                const sampled =
                    samplePolygonEdgesLast(
                        projected.localPoints,
                        sampleCount
                    );


                if (
                    sampled.length <
                    4
                ) {
                    return null;
                }


                const normalized =
                    normalizeShapeLast(
                        sampled
                    );


                return {
                    ...projected,

                    sampled,

                    normalized,

                    normalizedPoints:
                        normalized.points
                };
            }


            /* =========================================================
            19. ROTATE VECTOR
            ========================================================= */

            function rotateVectorLast(x, y, angle) {

                const cos =
                    Math.cos(
                        angle
                    );


                const sin =
                    Math.sin(
                        angle
                    );


                return {
                    x:
                        x *
                            cos -
                        y *
                            sin,

                    y:
                        x *
                            sin +
                        y *
                            cos
                };
            }


            /* =========================================================
            20. CREATE MAPBOX IMAGE COORDINATES
            =========================================================

            We create a rectangular canvas in local metres,
            rotate that canvas according to the discovered
            image orientation, then convert its corners back
            to longitude/latitude.

            IMPORTANT:

            Mapbox expects:
            [
                TL,
                TR,
                BR,
                BL
            ]
            ========================================================= */

            function getMainBodyBounds(imageShape, options = {}) {
                const {
                    supportThreshold = 0.12
                } = options;

                const width =
                    imageShape.maskWidth;

                const height =
                    imageShape.maskHeight;

                const mask =
                    imageShape.componentMask;

                if (
                    !mask ||
                    !width ||
                    !height
                ) {
                    return null;
                }

                const columnCounts =
                    new Array(width).fill(0);

                const rowCounts =
                    new Array(height).fill(0);

                /*
                * Count visible pixels in every row/column.
                */
                for (
                    let y = 0;
                    y < height;
                    y++
                ) {
                    for (
                        let x = 0;
                        x < width;
                        x++
                    ) {
                        if (
                            mask[
                                y * width + x
                            ]
                        ) {
                            columnCounts[x]++;

                            rowCounts[y]++;
                        }
                    }
                }

                const maxColumnCount =
                    Math.max(
                        ...columnCounts
                    );

                const maxRowCount =
                    Math.max(
                        ...rowCounts
                    );

                if (
                    maxColumnCount <= 0 ||
                    maxRowCount <= 0
                ) {
                    return null;
                }

                /*
                * Thin protrusions/roads have little support.
                *
                * Main project body has much larger vertical/
                * horizontal support.
                */
                const minimumColumnSupport =
                    maxColumnCount *
                    supportThreshold;

                const minimumRowSupport =
                    maxRowCount *
                    supportThreshold;

                let minX =
                    null;

                let maxX =
                    null;

                let minCanvasY =
                    null;

                let maxCanvasY =
                    null;

                /*
                * Find first/last meaningful column.
                */
                for (
                    let x = 0;
                    x < width;
                    x++
                ) {
                    if (
                        columnCounts[x] >=
                        minimumColumnSupport
                    ) {
                        if (
                            minX === null
                        ) {
                            minX = x;
                        }

                        maxX = x;
                    }
                }

                /*
                * Find first/last meaningful row.
                */
                for (
                    let y = 0;
                    y < height;
                    y++
                ) {
                    if (
                        rowCounts[y] >=
                        minimumRowSupport
                    ) {
                        if (
                            minCanvasY === null
                        ) {
                            minCanvasY = y;
                        }

                        maxCanvasY = y;
                    }
                }

                if (
                    minX === null ||
                    maxX === null ||
                    minCanvasY === null ||
                    maxCanvasY === null
                ) {
                    return null;
                }

                /*
                * IMPORTANT:
                *
                * Image Cartesian coordinates use:
                *
                * x = canvas X
                * y = -canvas Y
                *
                * Therefore:
                *
                * bottom canvas row -> minimum Cartesian Y
                * top canvas row    -> maximum Cartesian Y
                */
                return {
                    minX,
                    maxX,

                    minY:
                        -maxCanvasY,

                    maxY:
                        -minCanvasY
                };
            }

            function createMapboxCoordinatesFromAlignmentLast(projectShape, imageShape, alignment, options = {}) {
                const {
                    rotationOffsetDegrees = 0,
                    scaleMultiplier = 1,
                    offsetX = 0,
                    offsetY = 0,
                    fillCoordinateArea = true,
                    mainBodySupportThreshold = 0.12,
                    /*
                    * main-body sizing is activated only if
                    * it differs meaningfully from normal bounds.
                    */
                    mainBodyActivationThreshold = 0.04
                } = options;


                /* =====================================================
                1. ROTATION
                ===================================================== */

                const angle =
                    alignment.angleRadians +
                    (
                        rotationOffsetDegrees *
                        Math.PI /
                        180
                    );

                const cos =
                    Math.cos(angle);

                const sin =
                    Math.sin(angle);


                /*
                * Masterplan horizontal axis.
                */
                const ux =
                    cos;

                const uy =
                    sin;


                /*
                * Masterplan vertical axis.
                */
                const vx =
                    -sin;

                const vy =
                    cos;


                /* =====================================================
                2. IMAGE POINTS
                ===================================================== */

                /*
                * Use FULL boundary here.
                *
                * sampled points remain useful for rotation matching,
                * but final sizing needs the complete silhouette.
                */
                const sourceImagePoints =
                    (
                        Array.isArray(
                            imageShape.cartesianBoundary
                        ) &&
                        imageShape.cartesianBoundary.length
                    )
                        ?
                        imageShape.cartesianBoundary
                        :
                        imageShape.sampled;


                const imagePoints =
                    sourceImagePoints.map(
                        point => {
                            let x =
                                point.x;

                            const y =
                                point.y;

                            if (
                                alignment.mirrored
                            ) {
                                x =
                                    -x;
                            }

                            return {
                                x,
                                y
                            };
                        }
                    );


                /* =====================================================
                3. NORMAL IMAGE BOUNDS
                ===================================================== */

                const normalImageBounds = {
                    minX:
                        Math.min(
                            ...imagePoints.map(
                                point =>
                                    point.x
                            )
                        ),

                    maxX:
                        Math.max(
                            ...imagePoints.map(
                                point =>
                                    point.x
                            )
                        ),

                    minY:
                        Math.min(
                            ...imagePoints.map(
                                point =>
                                    point.y
                            )
                        ),

                    maxY:
                        Math.max(
                            ...imagePoints.map(
                                point =>
                                    point.y
                            )
                        )
                };


                /* =====================================================
                4. DENSE MAIN-BODY BOUNDS
                =====================================================

                This is the Badya fix.

                Rotation still came from the complete shape.

                Only final WIDTH/HEIGHT estimation can use
                the dense body when thin extensions distort
                the normal bounds.
                ===================================================== */

                let mainBodyBounds =
                    getMainBodyBounds(
                        imageShape,
                        {
                            supportThreshold:
                                mainBodySupportThreshold
                        }
                    );


                /*
                * getMainBodyBounds() operates before mirroring.
                *
                * Mirror X bounds when necessary.
                */
                if (
                    mainBodyBounds &&
                    alignment.mirrored
                ) {
                    const oldMinX =
                        mainBodyBounds.minX;

                    const oldMaxX =
                        mainBodyBounds.maxX;

                    mainBodyBounds = {
                        ...mainBodyBounds,

                        minX:
                            -oldMaxX,

                        maxX:
                            -oldMinX
                    };
                }


                /* =====================================================
                5. SELECT FINAL IMAGE SIZING BOUNDS
                ===================================================== */

                let imageMinX =
                    normalImageBounds.minX;

                let imageMaxX =
                    normalImageBounds.maxX;

                let imageMinY =
                    normalImageBounds.minY;

                let imageMaxY =
                    normalImageBounds.maxY;


                if (
                    mainBodyBounds
                ) {
                    const normalWidth =
                        normalImageBounds.maxX -
                        normalImageBounds.minX;

                    const normalHeight =
                        normalImageBounds.maxY -
                        normalImageBounds.minY;


                    const bodyWidth =
                        mainBodyBounds.maxX -
                        mainBodyBounds.minX;

                    const bodyHeight =
                        mainBodyBounds.maxY -
                        mainBodyBounds.minY;


                    const widthReduction =
                        normalWidth > 0
                            ?
                            (
                                normalWidth -
                                bodyWidth
                            ) /
                            normalWidth
                            :
                            0;


                    const heightReduction =
                        normalHeight > 0
                            ?
                            (
                                normalHeight -
                                bodyHeight
                            ) /
                            normalHeight
                            :
                            0;


                    /*
                    * Only alter an axis if there is a meaningful
                    * difference.
                    *
                    * Therefore normal masterplans keep their
                    * existing behaviour.
                    */
                    const useMainBodyWidth =
                        widthReduction >
                        mainBodyActivationThreshold;


                    const useMainBodyHeight =
                        heightReduction >
                        mainBodyActivationThreshold;


                    if (
                        useMainBodyWidth
                    ) {
                        imageMinX =
                            mainBodyBounds.minX;

                        imageMaxX =
                            mainBodyBounds.maxX;
                    }


                    if (
                        useMainBodyHeight
                    ) {
                        imageMinY =
                            mainBodyBounds.minY;

                        imageMaxY =
                            mainBodyBounds.maxY;
                    }

                    // console.log(
                    //     'MASTERPLAN BODY BOUNDS',
                    //     {
                    //         normalImageBounds,
                    //         mainBodyBounds,

                    //         normalWidth,
                    //         normalHeight,

                    //         bodyWidth,
                    //         bodyHeight,

                    //         widthReduction,
                    //         heightReduction,

                    //         useMainBodyWidth,
                    //         useMainBodyHeight
                    //     }
                    // );
                }


                /* =====================================================
                6. FINAL VISIBLE IMAGE DIMENSIONS
                ===================================================== */

                const imageWidth =
                    imageMaxX -
                    imageMinX;

                const imageHeight =
                    imageMaxY -
                    imageMinY;


                if (
                    !Number.isFinite(
                        imageWidth
                    ) ||
                    !Number.isFinite(
                        imageHeight
                    ) ||
                    imageWidth <= 0 ||
                    imageHeight <= 0
                ) {
                    return null;
                }


                /*
                * Centre of the sizing footprint.
                *
                * Important because if we ignore a road extension,
                * we must also centre based on the main body rather
                * than the entire PNG silhouette.
                */
                const imageCenterX =
                    (
                        imageMinX +
                        imageMaxX
                    ) /
                    2;


                const imageCenterY =
                    (
                        imageMinY +
                        imageMaxY
                    ) /
                    2;


                /* =====================================================
                7. PROJECT EXTENT ALONG EXISTING ROTATION AXES
                ===================================================== */

                let geoMinU =
                    Infinity;

                let geoMaxU =
                    -Infinity;

                let geoMinV =
                    Infinity;

                let geoMaxV =
                    -Infinity;


                for (
                    const point
                    of projectShape.localPoints
                ) {
                    const u =
                        point.x *
                            ux +
                        point.y *
                            uy;

                    const v =
                        point.x *
                            vx +
                        point.y *
                            vy;


                    geoMinU =
                        Math.min(
                            geoMinU,
                            u
                        );

                    geoMaxU =
                        Math.max(
                            geoMaxU,
                            u
                        );

                    geoMinV =
                        Math.min(
                            geoMinV,
                            v
                        );

                    geoMaxV =
                        Math.max(
                            geoMaxV,
                            v
                        );
                }


                const geoWidth =
                    geoMaxU -
                    geoMinU;


                const geoHeight =
                    geoMaxV -
                    geoMinV;


                if (
                    geoWidth <= 0 ||
                    geoHeight <= 0
                ) {
                    return null;
                }


                const geoCenterU =
                    (
                        geoMinU +
                        geoMaxU
                    ) /
                    2;


                const geoCenterV =
                    (
                        geoMinV +
                        geoMaxV
                    ) /
                    2;


                /* =====================================================
                8. FINAL X/Y SCALE
                ===================================================== */

                let scaleX =
                    geoWidth /
                    imageWidth;


                let scaleY =
                    geoHeight /
                    imageHeight;


                if (
                    !fillCoordinateArea
                ) {
                    const uniformScale =
                        Math.min(
                            scaleX,
                            scaleY
                        );

                    scaleX =
                        uniformScale;

                    scaleY =
                        uniformScale;
                }


                scaleX *=
                    scaleMultiplier;


                scaleY *=
                    scaleMultiplier;


                /* =====================================================
                9. GEOGRAPHIC CENTRE
                ===================================================== */

                function uvToXY(
                    u,
                    v
                ) {
                    return {
                        x:
                            u *
                                ux +
                            v *
                                vx,

                        y:
                            u *
                                uy +
                            v *
                                vy
                    };
                }


                const geographicCenter =
                    uvToXY(
                        geoCenterU,
                        geoCenterV
                    );


                /* =====================================================
                10. TRANSFORM IMAGE POINT
                ===================================================== */

                function transformImagePoint(
                    imageX,
                    imageY
                ) {
                    /*
                    * Canvas coordinates:
                    *
                    * X right
                    * Y down
                    *
                    * Cartesian:
                    *
                    * X right
                    * Y up
                    */
                    let x =
                        imageX;

                    let y =
                        -imageY;


                    if (
                        alignment.mirrored
                    ) {
                        x =
                            -x;
                    }


                    /*
                    * Relative to selected visible/main-body centre.
                    */
                    const relativeX =
                        x -
                        imageCenterX;


                    const relativeY =
                        y -
                        imageCenterY;


                    /*
                    * Fill project width and height separately.
                    */
                    const horizontal =
                        relativeX *
                        scaleX;


                    const vertical =
                        relativeY *
                        scaleY;


                    /*
                    * Rotate into geographic XY.
                    *
                    * Rotation logic itself has not changed.
                    */
                    return {
                        x:
                            geographicCenter.x +
                            horizontal *
                                ux +
                            vertical *
                                vx +
                            offsetX,

                        y:
                            geographicCenter.y +
                            horizontal *
                                uy +
                            vertical *
                                vy +
                            offsetY
                    };
                }


                /* =====================================================
                11. FULL PNG CANVAS
                =====================================================

                Keep rendering the FULL PNG.

                We changed only what part of its visible silhouette
                determines scale and centre.
                ===================================================== */

                const width =
                    imageShape.maskWidth;


                const height =
                    imageShape.maskHeight;


                /* =====================================================
                12. MAPBOX CORNERS
                ===================================================== */

                let localCorners;


                if (
                    alignment.mirrored
                ) {
                    localCorners = [
                        transformImagePoint(
                            width,
                            0
                        ),

                        transformImagePoint(
                            0,
                            0
                        ),

                        transformImagePoint(
                            0,
                            height
                        ),

                        transformImagePoint(
                            width,
                            height
                        )
                    ];
                } else {
                    localCorners = [
                        transformImagePoint(
                            0,
                            0
                        ),

                        transformImagePoint(
                            width,
                            0
                        ),

                        transformImagePoint(
                            width,
                            height
                        ),

                        transformImagePoint(
                            0,
                            height
                        )
                    ];
                }


                /* =====================================================
                13. LOCAL METRES -> LNG/LAT
                ===================================================== */

                const coordinates =
                    localCorners.map(
                        point =>
                            projectShape
                                .projection
                                .inverse(
                                    point
                                )
                    );


                // console.log(
                //     'MASTERPLAN FINAL FIT',
                //     {
                //         rotation:
                //             alignment.angleDegrees,

                //         mirrored:
                //             alignment.mirrored,

                //         imageWidth,
                //         imageHeight,

                //         geoWidth,
                //         geoHeight,

                //         scaleX,
                //         scaleY,

                //         coordinates
                //     }
                // );


                return coordinates;
            }

            function getFallbackUprightCoordinates(polygon, img) {

                const points =
                    cleanPolygonCoordinatesLast(
                        polygon
                    );


                if (
                    points.length <
                    3
                ) {
                    return null;
                }


                const lngs =
                    points.map(
                        point =>
                            point[0]
                    );


                const lats =
                    points.map(
                        point =>
                            point[1]
                    );


                let west =
                    Math.min(
                        ...lngs
                    );


                let east =
                    Math.max(
                        ...lngs
                    );


                let south =
                    Math.min(
                        ...lats
                    );


                let north =
                    Math.max(
                        ...lats
                    );


                const centerLng =
                    (
                        west +
                        east
                    ) /
                    2;


                const centerLat =
                    (
                        south +
                        north
                    ) /
                    2;


                const metersPerDegreeLat =
                    111320;


                const metersPerDegreeLng =
                    111320 *
                    Math.cos(
                        centerLat *
                        Math.PI /
                        180
                    );


                let widthMeters =
                    (
                        east -
                        west
                    ) *
                    metersPerDegreeLng;


                let heightMeters =
                    (
                        north -
                        south
                    ) *
                    metersPerDegreeLat;


                const imageAspect =
                    (
                        img.naturalWidth ||
                        img.width
                    ) /
                    (
                        img.naturalHeight ||
                        img.height
                    );


                const geographicAspect =
                    widthMeters /
                    heightMeters;


                if (
                    imageAspect >
                    geographicAspect
                ) {

                    widthMeters =
                        heightMeters *
                        imageAspect;

                } else {

                    heightMeters =
                        widthMeters /
                        imageAspect;
                }


                const longitudeSpan =
                    widthMeters /
                    metersPerDegreeLng;


                const latitudeSpan =
                    heightMeters /
                    metersPerDegreeLat;


                west =
                    centerLng -
                    longitudeSpan /
                    2;


                east =
                    centerLng +
                    longitudeSpan /
                    2;


                south =
                    centerLat -
                    latitudeSpan /
                    2;


                north =
                    centerLat +
                    latitudeSpan /
                    2;


                return [
                    [west, north],
                    [east, north],
                    [east, south],
                    [west, south]
                ];
            }

            function getOrientedBoundingBox(points) {
                if (!Array.isArray(points) || points.length < 3) {
                    return null;
                }

                const cleanPoints = points
                    .map(point => Array.isArray(point) && point.length >= 2 ? [Number(point[0]), Number(point[1])] : null)
                    .filter(point => point && !Number.isNaN(point[0]) && !Number.isNaN(point[1]));

                if (cleanPoints.length < 3) {
                    return null;
                }

                let best = null;
                for (let i = 0; i < cleanPoints.length; i++) {
                    const a = cleanPoints[i];
                    const b = cleanPoints[(i + 1) % cleanPoints.length];
                    const edgeX = b[0] - a[0];
                    const edgeY = b[1] - a[1];
                    const length = Math.hypot(edgeX, edgeY);

                    if (!length) {
                        continue;
                    }

                    const ux = edgeX / length;
                    const uy = edgeY / length;
                    const vx = -uy;
                    const vy = ux;
                    let minU = Infinity;
                    let maxU = -Infinity;
                    let minV = Infinity;
                    let maxV = -Infinity;

                    cleanPoints.forEach(point => {
                        const projectedU = point[0] * ux + point[1] * uy;
                        const projectedV = point[0] * vx + point[1] * vy;
                        minU = Math.min(minU, projectedU);
                        maxU = Math.max(maxU, projectedU);
                        minV = Math.min(minV, projectedV);
                        maxV = Math.max(maxV, projectedV);
                    });

                    const area = (maxU - minU) * (maxV - minV);
                    if (!best || area < best.area) {
                        const toPoint = (u, v) => [u * ux + v * vx, u * uy + v * vy];
                        best = {
                            area,
                            corners: [
                                toPoint(minU, maxV),
                                toPoint(maxU, maxV),
                                toPoint(maxU, minV),
                                toPoint(minU, minV)
                            ]
                        };
                    }
                }

                return best ? best.corners : null;
            }

            function orderImageCoordinates(corners) {
                if (!Array.isArray(corners) || corners.length !== 4) {
                    return null;
                }

                const center = corners.reduce((acc, point) => [acc[0] + point[0], acc[1] + point[1]], [0, 0])
                    .map(value => value / corners.length);
                const ordered = corners
                    .map(point => ({
                        point,
                        angle: Math.atan2(point[1] - center[1], point[0] - center[0])
                    }))
                    .sort((a, b) => a.angle - b.angle)
                    .map(item => item.point);

                const topIndex = ordered.reduce((bestIndex, point, index) => {
                    const best = ordered[bestIndex];
                    if (point[1] > best[1]) return index;
                    if (point[1] === best[1] && point[0] < best[0]) return index;
                    return bestIndex;
                }, 0);

                const rotated = ordered.slice(topIndex).concat(ordered.slice(0, topIndex));
                const signedArea = rotated.reduce((sum, point, index) => {
                    const next = rotated[(index + 1) % rotated.length];
                    return sum + ((next[0] - point[0]) * (next[1] + point[1]));
                }, 0);

                return signedArea > 0
                    ? rotated
                    : [rotated[0], rotated[3], rotated[2], rotated[1]];
            }
