                    const shown = showProjectBoundaryOverlay(project, { fit: true, notify: false });
                    if (!shown) showToast('لا توجد بيانات حدود لهذا المشروع', 'warning');
                    console.log('HELLO IN LINE 9340')
                    updateProjectPanelContent(project);
                    return;
                }

                currentMasterplanProject = projectId;
                const loadingEl = document.getElementById('masterplanLoading');
                loadingEl.classList.add('show');

                try {
                    if (map.getLayer('masterplan-layer')) map.removeLayer('masterplan-layer');
                    if (map.getSource('masterplan-source')) map.removeSource('masterplan-source');
                    if (map.getLayer('masterplan-boundary')) map.removeLayer('masterplan-boundary');
                    if (map.getLayer('masterplan-boundary-fill')) map.removeLayer('masterplan-boundary-fill');
                } catch (e) {}

                const [west, south, east, north] = getProjectBounds(project);
                const boundaryPolygon = getProjectPolygon(project) || [
                    [west, north],
                    [east, north],
                    [east, south],
                    [west, south],
                    [west, north]
                ];

                const imageCoordinates = getMasterplanImageCoordinates(project);
                const masterplanUrls = (project.masterplan_urls && project.masterplan_urls.length)
                    ? project.masterplan_urls
                    : getAssetUrlCandidates(project.masterplan);
                // Use prefetch cache if already loaded
                const _cachedImg = getCachedMasterplan(project.masterplan);

                const _applyMasterplanToMap = (resolvedUrl) => {
                    try {
                        map.fitBounds([[west, south], [east, north]], {
                            padding: { top: 170, right: 40, bottom: 150, left: 40 },
                            duration: 500
                        });

                        map.addSource('masterplan-source', {
                            type: 'image',
                            url: resolvedUrl,
                            coordinates: imageCoordinates
                        });

                        map.addLayer({
                            id: 'masterplan-layer',
                            type: 'raster',
                            source: 'masterplan-source',
                            paint: {
                                'raster-opacity': 0.82,
                                'raster-contrast': 0.08,
                                'raster-saturation': -0.08,
                                'raster-brightness-min': 0.05,
                                'raster-brightness-max': 0.98,
                                'raster-fade-duration': 400
                            }
                        });

                        map.addLayer({
                            id: 'masterplan-boundary-fill',
                            type: 'fill',
                            source: {
                                type: 'geojson',
                                data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [boundaryPolygon] } }
                            },
                            paint: { 'fill-color': '#E63946', 'fill-opacity': 0 }
                        });

                        map.addLayer({
                            id: 'masterplan-boundary',
                            type: 'line',
                            source: {
                                type: 'geojson',
                                data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [boundaryPolygon] } }
                            },
                            paint: { 'line-color': '#ffffff', 'line-width': 1.5, 'line-opacity': 0.42 }
                        });

                        masterplanVisible = true;
                        // document.getElementById('showMasterplanBtn').style.display = 'none';
                        // document.getElementById('hideMasterplanBtn').style.display = 'flex';
                        
                        console.log('SHOULD NOT GO IN APPLY')

                        updateProjectPanelContent(project);
                    } catch (error) {
                        showToast('خطأ في عرض الماستر بلان', 'error');
                    } finally {
                        loadingEl.classList.remove('show');
                    }
                };

                if (_cachedImg) {
                    // Image already in browser cache – apply immediately
                    _applyMasterplanToMap(_cachedImg.src);
                    return;
                }

                // Not cached yet – load now and cache
                let masterplanUrlIndex = 0;
                const img = new Image();
                const prepareImageRequest = () => {
                    try {
                        const nextUrl = new URL(masterplanUrls[masterplanUrlIndex] || project.masterplan, window.location.origin);
                        img.crossOrigin = nextUrl.origin !== window.location.origin ? 'Anonymous' : null;
                        if (!img.crossOrigin) img.removeAttribute('crossorigin');
                    } catch (e) {}
                };

                img.onload = function() {
                    _mpCache.set(project.masterplan, { img, status: 'ready' });
                    _applyMasterplanToMap(img.src);
                };

                img.onerror = function() {
                    loadingEl.classList.remove('show');
                    const shown = showProjectBoundaryOverlay(project, { fit: true, notify: false });
                    if (!shown) { showToast('فشل تحميل صورة الماستر بلان', 'error'); return; }
                    console.log('HELLO IN LINE 9456')

                };

            };

                const orientedBox = polygon ? orderImageCoordinates(getOrientedBoundingBox(polygon.slice(0, -1))) : null;

                if (orientedBox) {
                    return orientedBox;

                const [west, south, east, north] = getProjectBounds(project);

                    [east, north],

                            paint: {

            // ── Masterplan unit pin markers (Nawy-style) ──────────────────────────
            let masterplanUnitMarkers = [];
            let masterplanPrevStyle = null;

            function removeMasterplanLayers() {
                try {
                    if (map.getLayer('masterplan-layer')) map.removeLayer('masterplan-layer');
                    if (map.getSource('masterplan-source')) map.removeSource('masterplan-source');
                    if (map.getLayer('masterplan-boundary')) map.removeLayer('masterplan-boundary');
                    if (map.getLayer('masterplan-boundary-fill')) map.removeLayer('masterplan-boundary-fill');
                } catch (e) {}
            }

            function removeMasterplanUnitMarkers() {
                masterplanUnitMarkers.forEach(m => m.remove());
                masterplanUnitMarkers = [];
            }

            function addMasterplanUnitMarkers(project) {
                removeMasterplanUnitMarkers();
                const units = (project.units || []).filter(u => u.lat && u.lng);
                if (!units.length) return;

                // Group by compound_name → one marker per group at centroid
                const groups = new Map();
                units.forEach(u => {
                    const key = u.compound_name || u.type || 'وحدة';
                    if (!groups.has(key)) groups.set(key, { lat: 0, lng: 0, count: 0 });
                    const g = groups.get(key);
                    g.lat += Number(u.lat);
                    g.lng += Number(u.lng);
                    g.count++;
                });

                groups.forEach((g, name) => {
                    const lat = g.lat / g.count;
                    const lng = g.lng / g.count;
                    const el = document.createElement('div');
                    el.className = 'mp-unit-pin';
                    el.innerHTML = `<div class="mp-unit-pin__label">${name}</div><div class="mp-unit-pin__dot"></div>`;
                    el.addEventListener('click', () => {
                        const unitListEl = document.querySelector('.units-section, .units-grid, .proj-units');
                        if (unitListEl) unitListEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    const m = new mapboxgl.Marker({ element: el, anchor: 'bottom' })
                        .setLngLat([lng, lat])
                        .addTo(map);
                    masterplanUnitMarkers.push(m);
                });
            }

            function addMasterplanMapLayers(overlayUrl, imageCoordinates, boundaryPolygon) {
                map.addSource('masterplan-source', {
                    type: 'image',
                    url: overlayUrl,
                    coordinates: imageCoordinates
                });
                map.addLayer({
                    id: 'masterplan-layer',
                    type: 'raster',
                    source: 'masterplan-source',
                    paint: {
                        'raster-opacity': 0.88,
                        'raster-fade-duration': 0
                    }
                });
                map.addLayer({
                    id: 'masterplan-boundary-fill',
                    type: 'fill',
                    source: {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [boundaryPolygon] } }
                    },
                    paint: { 'fill-color': '#ffffff', 'fill-opacity': 0 }
                });
                map.addLayer({
                    id: 'masterplan-boundary',
                    type: 'line',
                    source: {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [boundaryPolygon] } }
                    },
                    paint: { 'line-color': '#1B3A6B', 'line-width': 3, 'line-opacity': 1 }
                });
            }

            window.showEnhancedMasterplan = function(projectId) {
                const project = PROJECTS.find(p => p.id === projectId);

                if (!project) return;

                if (!project.masterplan) {

                const [west, south, east, north] = getProjectBounds(project);

                    [west, north], [east, north], [east, south], [west, south], [west, north]
                ];

                if (west >= east || south >= north) {
                    loadingEl.classList.remove('show');

            window.openProjectPanel = function(projectId) {

                S.view = 'units';

                setBreadcrumb([

                map.fitBounds([[projectBounds[0], projectBounds[1]], [projectBounds[2], projectBounds[3]]], {

                }

                if (map.getLayer('project-boundary-line')) {

                }
            };

            buildProjectMarkers = function() {
                markers.forEach(m => m.remove());
                markers.length = 0;

                const bounds = map.getBounds();
                const zoom = map.getZoom();
                const visibleProjects = filteredProjects().filter(p => p.lng && p.lat && (!bounds || bounds.contains([p.lng, p.lat])));
                const shouldAggregate = zoom < 12.4 && visibleProjects.length > (window.innerWidth <= 768 ? 4 : 5);

                if (shouldAggregate) {
                    const cellSize = zoom < 5 ? 3.0 : zoom < 7 ? 1.2 : zoom < 9 ? 0.35 : zoom < 10 ? 0.09 : (zoom < 11.5 ? 0.055 : 0.035);
                    const buckets = new Map();

                    visibleProjects.forEach(project => {
                        const key = `${Math.round(project.lng / cellSize)}:${Math.round(project.lat / cellSize)}`;
                        const bucket = buckets.get(key) || { items: [], lng: 0, lat: 0 };
                        bucket.items.push(project);
                        bucket.lng += Number(project.lng);
                        bucket.lat += Number(project.lat);
                        buckets.set(key, bucket);
                    });

                    Array.from(buckets.values()).forEach(bucket => {
                        const count = bucket.items.length;
                        const primary = bucket.items.find(item => Number(item.id) === Number(S.activeProject)) || bucket.items[0];
                        const lng = bucket.lng / count;
                        const lat = bucket.lat / count;
                        const el = document.createElement('div');
                        const isSingle = count === 1;
                        const isActive = bucket.items.some(item => Number(item.id) === Number(S.activeProject));

                        el.className = `project-marker${isSingle ? '' : ' is-bucket'}`;
                        el.innerHTML = isSingle ? `
                            <div class="pm${isActive ? ' active' : ''}" style="color:${primary.color};">
                                ${renderProjectMarkerContent(primary)}
                            </div>
                        ` : `
                            <div class="pm" style="color:${primary.color};">
                                <div class="pm-label">
                                    ${count} مشروع
                                    <span class="pm-meta">${primary.name_ar}</span>
                                </div>
                                <div class="pm-bucket${isActive ? ' is-active' : ''}">${count}</div>
                            </div>
                        `;

                        const marker = new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);

                        el.addEventListener('click', () => {
                            if (count === 1) {
                                openProjectPanel(primary.id);
                                return;
                            }

                            map.easeTo({
                                center: [lng, lat],
                                zoom: Math.min(zoom + 1.2, 12.2),
                                duration: 700
                            });
                        });

                        markers.push(marker);
                    });
                } else {
                    const maxMarkers = window.innerWidth <= 768 ? 18 : 36;
                    const prioritizedProjects = visibleProjects
                        .sort((a, b) => Number(Number(a.id) === Number(S.activeProject)) - Number(Number(b.id) === Number(S.activeProject)))
                        .slice(-maxMarkers);

                    prioritizedProjects.forEach(p => {
                        const el = document.createElement('div');
                        el.className = 'project-marker';
                        const active = S.activeProject === p.id;

                        el.innerHTML = `
                            <div class="pm${active ? ' active' : ''}" style="color:${p.color};">
                                ${renderProjectMarkerContent(p)}
                            </div>
                        `;

                        const marker = new mapboxgl.Marker(el)
                            .setLngLat([p.lng, p.lat])
                            .addTo(map);

                        el.addEventListener('click', () => openProjectPanel(p.id));
                        markers.push(marker);
                    });
                }

                addBoundaryLayers();
            };

            const unitMarkersIndex = new Map();

            function normalizeUnitTypeLabel(type) {
                const value = String(type || '').trim();
                const map = {
                    'شقه': 'شقة',
                    'Apartment': 'شقة',
                    'Apartments': 'شقة',
                    'Villa': 'فيلا',
                    'Villas': 'فيلا',
                    'Townhouse': 'تاون هاوس',
                    'Town House': 'تاون هاوس',
                    'Duplex': 'دوبلكس',
                    'Penthouse': 'بنتهاوس'
                };

                return map[value] || value || 'شقة';
            }

            function matchesUnitFilters(u) {
                const unitType = normalizeUnitTypeLabel(u.type);
                if (S.activeProject && u.compound_id && Number(u.compound_id) !== Number(S.activeProject)) return false;
                if (S.country !== 'all' && Number(u.country_id) !== parseInt(S.country, 10)) return false;
                if (S.search && !String(u.compound_name || '').includes(S.search) && !String(unitType).includes(S.search) && !String(u.code || '').includes(S.search)) return false;
                if (S.pMin !== null && Number(u.price) < S.pMin) return false;
                if (S.pMax !== null && Number(u.price) > S.pMax) return false;
                if (S.aMin !== null && Number(u.area) < S.aMin) return false;
                if (S.aMax !== null && Number(u.area) > S.aMax) return false;
                if (S.types.length > 0 && !S.types.includes(unitType)) return false;
                return true;
            }

            filteredUnits = function() {
                return UNITS
                    .map(u => ({ ...u, type: normalizeUnitTypeLabel(u.type) }))
                    .filter(matchesUnitFilters);
            };

            function formatUnitPriceLabel(price) {
                const numeric = Number(price || 0);
                if (!numeric) return 'السعر عند الطلب';
                return `${new Intl.NumberFormat('ar-EG', { maximumFractionDigits: 2 }).format(numeric)} مليون`;
            }

            function formatDeliveryLabel(deliveryIn) {
                if (!deliveryIn) return 'جاهز أو غير محدد';
                return String(deliveryIn);
            }

            function getUnitTypeTheme(type) {
                const unitType = normalizeUnitTypeLabel(type);
                const themes = {
                    'شقة': { color: '#E63946', icon: '🏢' },
                    'فيلا': { color: '#2D6A4F', icon: '🏡' },
                    'تاون هاوس': { color: '#D4A017', icon: '🏘️' },
                    'دوبلكس': { color: '#0077B6', icon: '🏗️' },
                    'بنتهاوس': { color: '#7B2CBF', icon: '🌆' }
                };

                return themes[unitType] || { color: '#6B7280', icon: '📍' };
            }

            function isPdfUrl(value) {
                return /\.pdf($|\?)/i.test(String(value || '').trim());
            }

            function findProjectByUnit(unit) {
                return PROJECTS.find(project =>
                    Number(project.id) === Number(unit.compound_id) ||
                    (project.units || []).some(projectUnit => Number(projectUnit.id) === Number(unit.id))
                ) || null;
            }

            function enrichUnit(unit, project = null) {
                const sourceProject = project || findProjectByUnit(unit) || {};
                return {
                    ...unit,
                    type: normalizeUnitTypeLabel(unit.type),
                    compound_id: unit.compound_id || sourceProject.id || null,
                    compound_name: unit.compound_name || sourceProject.name_ar || '',
                    compound_image: unit.compound_image || sourceProject.image || null,
                    developer: unit.developer || sourceProject.developer || '',
                    developer_logo: unit.developer_logo || sourceProject.developer_logo || null,
                    address: unit.address || sourceProject.address || '',
                    image: unit.image || unit.compound_image || sourceProject.image || null,
                    price_list_pdf: unit.price_list_pdf || sourceProject.price_list_pdf || (isPdfUrl(unit.masterplan) ? unit.masterplan : null),
                    delivery_in: unit.delivery_in || sourceProject.delivery_in || '',
                    country_id: unit.country_id || sourceProject.country_id || null
                };
            }

            function getUnitsForCurrentMapContext() {
                if (S.activeProject) {
                    const activeProject = PROJECTS.find(project => Number(project.id) === Number(S.activeProject));
                    return (activeProject?.units || []).map(unit => enrichUnit(unit, activeProject)).filter(matchesUnitFilters);
                }

                if (UNITS.length > 0) {
                    return filteredUnits();
                }

                return filteredProjects().flatMap(project =>
                    (project.units || []).map(unit => enrichUnit(unit, project)).filter(matchesUnitFilters)
                );
            }

                unitMarkersIndex.clear();

            function getMasterplanRasterPaint() {
                if (window.innerWidth <= 768) {
                    return {
                        'raster-opacity': 1,
                        'raster-contrast': 0,
                        'raster-saturation': 0,
                        'raster-brightness-min': 0,
                        'raster-brightness-max': 1,
                        'raster-fade-duration': 0
                    };
                }

                return {
                    'raster-opacity': 1,
                    'raster-contrast': 0,
                    'raster-saturation': 0,
                    'raster-brightness-min': 0,
                    'raster-brightness-max': 1,
                    'raster-fade-duration': 0
                };
            }

            function interpolateQuadPoint(quad, u, v) {
                const tl = quad[0];
                const tr = quad[1];
                const br = quad[2];
                const bl = quad[3];

                const x =
                    (1 - u) * (1 - v) * tl[0] +
                    u * (1 - v) * tr[0] +
                    u * v * br[0] +
                    (1 - u) * v * bl[0];
                const y =
                    (1 - u) * (1 - v) * tl[1] +
                    u * (1 - v) * tr[1] +
                    u * v * br[1] +
                    (1 - u) * v * bl[1];

                return [x, y];
            }

            function geoPointToImagePixel(point, quad, width, height) {
                if (!Array.isArray(point) || point.length < 2 || !Array.isArray(quad) || quad.length !== 4) {
                    return null;
                }

                const targetX = Number(point[0]);
                const targetY = Number(point[1]);
                if (Number.isNaN(targetX) || Number.isNaN(targetY)) {
                    return null;
                }

                let u = 0.5;
                let v = 0.5;

                for (let i = 0; i < 12; i++) {
                    const [x, y] = interpolateQuadPoint(quad, u, v);
                    const errorX = x - targetX;
                    const errorY = y - targetY;

                    if (Math.abs(errorX) + Math.abs(errorY) < 1e-8) {
                        break;
                    }

                    const epsilon = 1e-5;
                    const [xU, yU] = interpolateQuadPoint(quad, Math.min(1, u + epsilon), v);
                    const [xV, yV] = interpolateQuadPoint(quad, u, Math.min(1, v + epsilon));

                    const dxdu = (xU - x) / epsilon;
                    const dydu = (yU - y) / epsilon;
                    const dxdv = (xV - x) / epsilon;
                    const dydv = (yV - y) / epsilon;

                    const determinant = dxdu * dydv - dxdv * dydu;
                    if (Math.abs(determinant) < 1e-10) {
                        break;
                    }

                    const deltaU = (dydv * errorX - dxdv * errorY) / determinant;
                    const deltaV = (-dydu * errorX + dxdu * errorY) / determinant;

                    u = Math.max(0, Math.min(1, u - deltaU));
                    v = Math.max(0, Math.min(1, v - deltaV));
                }

                return [
                    Math.max(0, Math.min(width, u * width)),
                    Math.max(0, Math.min(height, v * height))
                ];
            }

            function createMasterplanOverlayUrl(img, imageCoordinates, boundaryPolygon) {
                if (!Array.isArray(imageCoordinates) || imageCoordinates.length !== 4 || !Array.isArray(boundaryPolygon) || boundaryPolygon.length < 4) {
                    return img.src;
                }

                try {
                    const canvas = document.createElement('canvas');
                    const width = img.naturalWidth || img.width;
                    const height = img.naturalHeight || img.height;

                    if (!width || !height) {
                        return img.src;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, width, height);

                    const pixelPolygon = boundaryPolygon
                        .map(point => geoPointToImagePixel(point, imageCoordinates, width, height))
                        .filter(Boolean);

                    if (pixelPolygon.length < 3) {
                        return img.src;
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(pixelPolygon[0][0], pixelPolygon[0][1]);
                    for (let i = 1; i < pixelPolygon.length; i++) {
                        ctx.lineTo(pixelPolygon[i][0], pixelPolygon[i][1]);
                    }
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, 0, 0, width, height);
                    ctx.restore();

                    return canvas.toDataURL('image/png');
                } catch (error) {
                    console.warn('Masterplan overlay processing failed:', error);
                    return img.src;
                }
            }

            function getDistanceKm(lat1, lng1, lat2, lng2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;

                const a =
                    Math.sin(dLat / 2) ** 2 +
                    Math.cos(lat1 * Math.PI / 180) *
                    Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng / 2) ** 2;

                const c =
                    2 * Math.atan2(
                        Math.sqrt(a),
                        Math.sqrt(1 - a)
                    );

                return R * c;
            }

            function getProjectCenter(project) {
                const lat = Number(project.lat);
                const lng = Number(project.lng);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lng)
                ) {
                    return null;
                }

                return {
                    lat: lat,
                    lng: lng
                };
            }

            function getBufferedMapBounds(bufferKm = 50) {
                const bounds = map.getBounds();

                const north = bounds.getNorth();
                const south = bounds.getSouth();
                const east = bounds.getEast();
                const west = bounds.getWest();

                const centerLat =
                    (north + south) / 2; 

                /*
                * 1 degree latitude ≈ 111.32 km
                */
                const latBuffer =
                    bufferKm / 111.32;

                /*
                * Longitude distance depends on latitude.
                */
                const cosLat =
                    Math.cos(
                        centerLat * Math.PI / 180
                    );

                const lngBuffer =
                    bufferKm /
                    (111.32 * Math.max(cosLat, 0.01));

                return {
                    north: north + latBuffer,
                    south: south - latBuffer,
                    east: east + lngBuffer,
                    west: west - lngBuffer
                };
            }

            function getProjectsAroundMap(bufferKm = 50) {
                const bounds = getBufferedMapBounds(bufferKm);

                const projects = PROJECTS.filter(project => {
                    const center = getProjectCenter(project);

                    if (!center) {
                        return false;
                    }

                    return (
                        center.lat >= bounds.south &&
                        center.lat <= bounds.north &&
                        center.lng >= bounds.west &&
                        center.lng <= bounds.east
                    );
                });
                return projects;
            }

            function updateProjectsAroundMap() {
                const nearbyProjects = getProjectsAroundMap(PROJECT_VIEWPORT_BUFFER_KM);
                updateMapProjects(nearbyProjects);
            }

            function updateMapProjects(projects) {
                projects.forEach(project => {

            }

               SHARY — MASTER PLAN PLACEMENT (FINAL)                                    [2026-10-05]
               =====================================================================================
               البلوك ده هو المرجع الوحيد لعرض الماستر بلان على الخريطة — وبيلغي كل النسخ القديمة اللي فوق
               (renderCityMasterplan / showEnhancedMasterplan / getMasterplanImageCoordinates ...).

               القاعدة:
               1) مكان الماستر بلان = اللي اتحفظ من أداة الضبط (masterplan_corners) — بيتعرض زي ما هو بالظبط.
                  masterplan_corners = 4 نقط [lng, lat] بالترتيب: أعلى-يسار الصورة ، أعلى-يمين ، أسفل-يمين ، أسفل-يسار.
                  الترتيب ده جواه الدوران والقلب (Flip) والحجم والمكان — ممنوع إعادة ترتيب النقط.
               2) المطابقة التلقائية (autoAlignMasterplanLast) بقت احتياطي بس للمشروع اللي لسه ما اتضبطش —
                  عمرها ما بتغيّر مكان اتحفظ.
               3) كل مشروع له source/layer باسمه (masterplan-source-{id}) — مشروع ما بيمسحش مشروع.
               4) الجودة: الصورة الأصلية بتتعرض من غير إعادة رسم (لو المكان محفوظ) + نسخة HD بتتحمل مع الزوم
                  (masterplan_hd) + دعم Tiles (masterplan_tiles) للمشاريع الكبيرة.
               5) الذاكرة: بيتحمل اللي في الشاشة بس (من زوم MIN_ZOOM) والبعيد بيتشال — عشان الخريطة ما تقعش على الموبايل.

               مكان كل مشروع بييجي من واحد من اتنين:
                   أ) ملف /map-data/masterplan-placements.json (بيطلع من أداة الضبط ويترفع على السيرفر — من غير برمجة باك إند)
                   ب) حقل masterplan_corners في الـ API (لو اتضاف في الداتابيز — وده اللي بيكسب لو الاتنين موجودين)

               حقول الـ API (/api/map/compounds) لكل مشروع — كلها اختيارية ما عدا masterplan:
                   masterplan            لينك الصورة (PNG / WebP مفرّغة — الطول الأكبر 2048 – 4096px)
                   masterplan_corners    [[lng,lat],[lng,lat],[lng,lat],[lng,lat]]   ← اللي بترجع من أداة الضبط
                   masterplan_placement  { center:[lng,lat], width_m, height_m, rotation, flip_x, flip_y }  (بديل/حالة الأداة)
                   masterplan_hd         لينك نسخة أعلى دقة (لحد 8192px) — بتتحمل من زوم HD_ZOOM
                   masterplan_tiles      'https://.../{z}/{x}/{y}.png' + masterplan_tiles_meta { bounds:[w,s,e,n], minzoom, maxzoom }
                   masterplan_version    رقم/تاريخ آخر تعديل (بيتحط ?v= عشان الكاش)
                   masterplan_clip       true = قص الصورة على حدود المشروع (للصور اللي مش مفرّغة بس)
                   masterplan_opacity    0 – 1 (الافتراضي 1)
               ===================================================================================== */
            (function () {
                const isMobile = () => window.innerWidth <= 768;
                const MP = window.SharyMasterplans = {
                    MIN_ZOOM: 10,                       // تحت الزوم ده الماستر بلان مش بتتحمل (بتبقى نقطة)
                    HD_ZOOM: 15.5,                      // من الزوم ده بتتحمل نسخة masterplan_hd
                    MAX_ACTIVE: isMobile() ? 8 : 24,    // أقصى عدد ماستر بلان محمّلة في نفس الوقت
                    VIEW_BUFFER: 0.5,                   // هامش حوالين الشاشة (نسبة من عرضها)
                    rendered: new Map(),                // id -> { token, sourceId, layerId, coords, hd, tiles }
                    hidden: new Set(),                  // مشاريع العميل ضغط "إخفاء من الخريطة" عليها
                    failed: new Map()                   // id -> عدد محاولات التحميل الفاشلة
                };
                const legacyAutoCoordinates = getMasterplanImageCoordinates;   // المطابقة التلقائية القديمة (احتياطي)
                const R = 6378137;
                const toMerc = ([lng, lat]) => [R * lng * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
                const fromMerc = ([x, y]) => [x / R * 180 / Math.PI, (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI];

                let maxTexture = 0;
                function maxTextureSize() {
                    if (maxTexture) return maxTexture;
                    try {
                        const gl = document.createElement('canvas').getContext('webgl');
                        maxTexture = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096;
                    } catch (e) { maxTexture = 4096; }
                    maxTexture = Math.min(maxTexture || 4096, isMobile() ? 4096 : 8192);
                    return maxTexture;
                }

                /* ---------- المكان المحفوظ ---------- */
                // 4 نقط [lng, lat] بالترتيب TL, TR, BR, BL — من غير أي إعادة ترتيب
                function parseCorners(value) {
                    let raw = parseDeepJson(value);
                    if (raw && !Array.isArray(raw) && typeof raw === 'object') {
                        raw = raw.corners || raw.coordinates || [raw.tl || raw.top_left, raw.tr || raw.top_right, raw.br || raw.bottom_right, raw.bl || raw.bottom_left];
                    }
                    if (!Array.isArray(raw)) return null;
                    // مضلع مقفول (5 نقط أولها = آخرها) ← أول 4
                    if (raw.length === 5) raw = raw.slice(0, 4);
                    if (raw.length !== 4) return null;
                    const corners = raw.map(point => {
                        if (Array.isArray(point)) return [Number(point[0]), Number(point[1])];
                        if (point && typeof point === 'object') return [Number(point.lng ?? point.lon ?? point.x), Number(point.lat ?? point.y)];
                        return [NaN, NaN];
                    });
                    if (!corners.every(c => Number.isFinite(c[0]) && Number.isFinite(c[1]) && Math.abs(c[0]) <= 180 && Math.abs(c[1]) <= 85)) return null;
                    // مساحة الشكل لازم تبقى حقيقية (مش 4 نقط على خط واحد)
                    const m = corners.map(toMerc);
                    let area = 0;
                    for (let i = 0; i < 4; i++) { const a = m[i], b = m[(i + 1) % 4]; area += a[0] * b[1] - b[0] * a[1]; }
                    return Math.abs(area) > 1 ? corners : null;
                }
                // { center:[lng,lat], width_m, height_m, rotation (درجات مع عقارب الساعة), flip_x, flip_y } ← 4 أركان
                function placementToCorners(value) {
                    const p = parseDeepJson(value);
                    if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
                    const center = Array.isArray(p.center) ? p.center.map(Number) : [Number(p.center?.lng ?? p.lng), Number(p.center?.lat ?? p.lat)];
                    const width = Number(p.width_m), height = Number(p.height_m);
                    if (![center[0], center[1], width, height].every(Number.isFinite) || width <= 0 || height <= 0) return null;
                    const k = 1 / Math.cos(center[1] * Math.PI / 180);      // مقياس ميركاتور عند خط العرض ده
                    const hw = width * k / 2, hh = height * k / 2;
                    const t = (Number(p.rotation) || 0) * Math.PI / 180;
                    const right = [Math.cos(t), -Math.sin(t)], up = [Math.sin(t), Math.cos(t)];
                    const c = toMerc(center);
                    const at = (sx, sy) => fromMerc([c[0] + right[0] * hw * sx + up[0] * hh * sy, c[1] + right[1] * hw * sx + up[1] * hh * sy]);
                    let [tl, tr, br, bl] = [at(-1, 1), at(1, 1), at(1, -1), at(-1, -1)];
                    if (p.flip_x) { [tl, tr] = [tr, tl]; [bl, br] = [br, bl]; }
                    if (p.flip_y) { [tl, bl] = [bl, tl]; [tr, br] = [br, tr]; }
                    return [tl, tr, br, bl];
                }
                function savedCorners(project) {
                    return parseCorners(project && project.masterplan_corners) || placementToCorners(project && project.masterplan_placement);
                }
                MP.savedCorners = savedCorners;
                MP.placementToCorners = placementToCorners;

                // المرجع الوحيد لإحداثيات الصورة: المحفوظ أولًا — والتلقائي احتياطي بس
                getMasterplanImageCoordinates = function (project, width, height, boundaryPolygon, img) {
                    const saved = savedCorners(project);
                    if (saved) return saved;
                    try { return legacyAutoCoordinates(project, width, height, boundaryPolygon, img); } catch (e) { return null; }
                };

                /* ---------- ملف الأماكن: masterplan-placements.json (من غير أي تعديل في الداتابيز) ----------
                   الملف بيطلع من أداة الضبط (masterplan-aligner.html ← "تحميل ملف الأماكن") ويترفع على السيرفر في public/map-data/.
                   الشكل: { "projects": { "<id المشروع>": { "masterplan_corners": [[lng,lat] × 4], "masterplan": "لينك صورة (اختياري)", "masterplan_hd": "...", "version": 3 } } }
                   لو الـ API نفسه رجّع masterplan_corners للمشروع فهو اللي بيتستخدم (إلا لو في الملف "override": true). */
                MP.PLACEMENTS_URL = window.SHARY_MP_PLACEMENTS_URL === undefined ? '/map-data/masterplan-placements.json' : window.SHARY_MP_PLACEMENTS_URL;
                MP.placements = {};
                function applyPlacements() {
                    PROJECTS.forEach(project => {
                        const item = MP.placements[project.id];
                        if (!item || project.__mpFile === item) return;
                        if (project.__mpFile === undefined) project.__mpApi = !!savedCorners(project);
                        project.__mpFile = item;
                        const corners = parseCorners(item.masterplan_corners || item.corners);
                        if (corners && (!project.__mpApi || item.override)) { project.masterplan_corners = corners; project.masterplan_placement = null; }
                        if (item.masterplan) { project.masterplan = normalizeAssetUrl(item.masterplan); project.masterplan_urls = getAssetUrlCandidates(item.masterplan); }
                        if (item.masterplan_hd) project.masterplan_hd = normalizeAssetUrl(item.masterplan_hd);
                        if (item.version && !project.masterplan_version) project.masterplan_version = item.version;
                        if (MP.rendered.has(project.id)) removeProject(project.id);      // يترسم تاني بالمكان الجديد
                        MP.failed.delete(project.id);
                    });
                }
                MP.loadPlacements = function () {
                    if (!MP.PLACEMENTS_URL) return Promise.resolve();
                    return fetch(MP.PLACEMENTS_URL, { cache: 'no-cache' })
                        .then(response => response.ok ? response.json() : null)
                        .then(data => {
                            if (!data || typeof data !== 'object') return;
                            MP.placements = data.projects && typeof data.projects === 'object' ? data.projects : data;
                            if (PROJECTS.length) updateProjectsAroundMap();
                        })
                        .catch(() => { /* الملف مش موجود: الخريطة شغالة بالـ API بس */ });
                };

                /* ---------- أدوات ---------- */
                const ids = id => ({
                    sourceId: `masterplan-source-${id}`, layerId: `masterplan-layer-${id}`,
                    boundarySourceId: `masterplan-source-${id}-boundary`, boundaryId: `masterplan-boundary-${id}`, boundaryFillId: `masterplan-boundary-fill-${id}`
                });
                function withVersion(url, project) {
                    const v = project.masterplan_version;
                    if (!url || !v || /^data:/.test(url)) return url;
                    return url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v);
                }
                function boundsOf(project) {
                    const corners = savedCorners(project);
                    if (corners) {
                        const lngs = corners.map(c => c[0]), lats = corners.map(c => c[1]);
                        return [Math.min(...lngs), Math.min(...lats), Math.max(...lngs), Math.max(...lats)];
                    }
                    return getProjectBounds(project);
                }
                function inView(project) {
                    const b = map.getBounds();
                    const padLng = (b.getEast() - b.getWest()) * MP.VIEW_BUFFER, padLat = (b.getNorth() - b.getSouth()) * MP.VIEW_BUFFER;
                    const [w, s, e, n] = boundsOf(project);
                    return e >= b.getWest() - padLng && w <= b.getEast() + padLng && n >= b.getSouth() - padLat && s <= b.getNorth() + padLat;
                }
                function loadImage(urls, done) {
                    let index = 0;
                    const img = new Image();
                    const next = () => {
                        if (index >= urls.length) { done(null); return; }
                        try {
                            if (new URL(urls[index], window.location.origin).origin !== window.location.origin) img.crossOrigin = 'Anonymous';
                            else img.removeAttribute('crossorigin');
                        } catch (e) { img.removeAttribute('crossorigin'); }
                        img.src = urls[index];
                    };
                    img.onload = () => done(img);
                    img.onerror = () => { index += 1; next(); };
                    next();
                }
                // صورة أكبر من اللي كارت الشاشة يستحمله: بتتصغّر لأقصى مقاس مسموح (بدل ما تفشل)
                function fitTexture(img) {
                    const cap = maxTextureSize();
                    const w = img.naturalWidth, h = img.naturalHeight;
                    if (Math.max(w, h) <= cap) return img.src;
                    try {
                        const scale = cap / Math.max(w, h);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        return canvas.toDataURL('image/png');
                    } catch (e) { return img.src; }
                }
                function removeProject(id) {
                    const x = ids(id);
                    try {
                        [x.layerId, x.boundaryId, x.boundaryFillId].forEach(layer => { if (map.getLayer(layer)) map.removeLayer(layer); });
                        [x.sourceId, x.boundarySourceId].forEach(source => { if (map.getSource(source)) map.removeSource(source); });
                    } catch (e) { console.warn('masterplan remove', id, e); }
                    MP.rendered.delete(id);
                    cityMasterplanProjectIds = Array.from(MP.rendered.keys());
                }
                MP.remove = removeProject;

                function paintFor(project) {
                    const paint = Object.assign({}, getMasterplanRasterPaint(), { 'raster-resampling': 'linear', 'raster-fade-duration': 0 });
                    const opacity = Number(project.masterplan_opacity);
                    if (Number.isFinite(opacity) && opacity > 0 && opacity <= 1) paint['raster-opacity'] = opacity;
                    return paint;
                }
                function addBoundary(project, x) {
                    const polygon = getProjectPolygon(project);
                    if (!polygon) return;
                    map.addSource(x.boundarySourceId, { type: 'geojson', data: { type: 'Feature', properties: { id: project.id }, geometry: { type: 'Polygon', coordinates: [polygon] } } });
                    map.addLayer({ id: x.boundaryFillId, type: 'fill', source: x.boundarySourceId, paint: { 'fill-color': '#ffffff', 'fill-opacity': 0 } });
                    map.addLayer({ id: x.boundaryId, type: 'line', source: x.boundarySourceId, paint: { 'line-color': '#ffffff', 'line-width': isMobile() ? 1 : 1.2, 'line-opacity': 0 } });
                }
                function applyVisibility(id) {
                    const x = ids(id);
                    if (map.getLayer(x.layerId)) map.setLayoutProperty(x.layerId, 'visibility', MP.hidden.has(id) ? 'none' : 'visible');
                }

                /* ---------- عرض ماستر بلان مشروع واحد ---------- */
                renderCityMasterplan = function (project) {
                    if (!project || !hasRenderableMasterplan(project)) return;
                    const id = project.id;
                    const x = ids(id);
                    if (MP.rendered.has(id)) return;                       // معروض أو بيتحمل
                    if ((MP.failed.get(id) || 0) >= 2) return;             // الصورة مش بتتحمل — ما نكررش للأبد
                    const token = {};
                    MP.rendered.set(id, { token: token, sourceId: x.sourceId, layerId: x.layerId, coords: null, hd: false, tiles: false });
                    cityMasterplanProjectIds = Array.from(MP.rendered.keys());
                    const alive = () => { const entry = MP.rendered.get(id); return entry && entry.token === token; };

                    // 1) Tiles (لو السيرفر مجهّزها): أعلى جودة مع أي زوم
                    const meta = parseDeepJson(project.masterplan_tiles_meta) || {};
                    if (project.masterplan_tiles && Array.isArray(meta.bounds) && meta.bounds.length === 4) {
                        try {
                            removeLayersOnly(x);
                            map.addSource(x.sourceId, { type: 'raster', tiles: [project.masterplan_tiles], tileSize: Number(meta.tile_size) || 256, bounds: meta.bounds.map(Number), minzoom: Number(meta.minzoom) || 12, maxzoom: Number(meta.maxzoom) || 20 });
                            map.addLayer({ id: x.layerId, type: 'raster', source: x.sourceId, paint: paintFor(project) });
                            addBoundary(project, x);
                            MP.rendered.get(id).tiles = true;
                            applyVisibility(id);
                        } catch (error) { console.error('Masterplan tiles error', id, error); removeProject(id); }
                        return;
                    }

                    // 2) صورة واحدة فوق الخريطة
                    const urls = ((project.masterplan_urls && project.masterplan_urls.length) ? project.masterplan_urls : getAssetUrlCandidates(project.masterplan)).map(url => withVersion(url, project));
                    if (!urls.length) { MP.rendered.delete(id); return; }
                    loadImage(urls, img => {
                        if (!alive()) return;                               // المشروع اتشال أو الخريطة اتغيّر شكلها والصورة لسه بتتحمل
                        if (!img) {
                            MP.failed.set(id, (MP.failed.get(id) || 0) + 1);
                            removeProject(id);
                            console.warn(`Could not load masterplan for project ${id}`);
                            return;
                        }
                        try {
                            const saved = savedCorners(project);
                            const polygon = getProjectPolygon(project);
                            let coords = saved || getMasterplanImageCoordinates(project, img.naturalWidth, img.naturalHeight, polygon, img);
                            if (!parseCorners(coords)) {
                                const [w, s, e, n] = getProjectBounds(project);
                                coords = [[w, n], [e, n], [e, s], [w, s]];
                            }
                            // مكان محفوظ + صورة مفرّغة: الصورة الأصلية زي ما هي (من غير إعادة رسم = من غير فقد جودة)
                            // غير كده (مشروع لسه ما اتضبطش ، أو masterplan_clip): القص القديم على حدود المشروع
                            let url = (saved && !project.masterplan_clip) || !polygon ? fitTexture(img) : createMasterplanClippedToPolygon(img, coords, polygon);
                            removeLayersOnly(x);
                            map.addSource(x.sourceId, { type: 'image', url: url, coordinates: coords });
                            map.addLayer({ id: x.layerId, type: 'raster', source: x.sourceId, paint: paintFor(project) });
                            addBoundary(project, x);
                            const entry = MP.rendered.get(id);
                            entry.coords = coords; entry.saved = !!saved;
                            MP.failed.delete(id);
                            applyVisibility(id);
                            upgradeQuality();
                        } catch (error) {
                            console.error(`Masterplan render error: ${id}`, error);
                            MP.failed.set(id, (MP.failed.get(id) || 0) + 1);
                            removeProject(id);
                        }
                    });
                };
                function removeLayersOnly(x) {
                    [x.layerId, x.boundaryId, x.boundaryFillId].forEach(layer => { if (map.getLayer(layer)) map.removeLayer(layer); });
                    [x.sourceId, x.boundarySourceId].forEach(source => { if (map.getSource(source)) map.removeSource(source); });
                }

                /* ---------- الجودة مع الزوم: نسخة HD ---------- */
                function upgradeQuality() {
                    if (map.getZoom() < MP.HD_ZOOM) return;
                    MP.rendered.forEach((entry, id) => {
                        if (entry.hd || entry.tiles || !entry.coords) return;
                        const project = PROJECTS.find(p => p.id === id);
                        if (!project || !project.masterplan_hd || project.masterplan_clip || !inView(project)) return;
                        entry.hd = true;
                        const token = entry.token;
                        loadImage([withVersion(project.masterplan_hd, project)], img => {
                            const now = MP.rendered.get(id);
                            if (!img || !now || now.token !== token) { if (now && now.token === token) now.hd = !img ? 'failed' : false; return; }
                            try {
                                const source = map.getSource(entry.sourceId);
                                if (source && source.updateImage) source.updateImage({ url: fitTexture(img), coordinates: entry.coords });
                            } catch (e) { console.warn('masterplan HD', id, e); }
                        });
                    });
                }

                /* ---------- اللي في الشاشة بس ---------- */
                let retryTimer = null, retries = 0;
                function styleReady() {
                    try { if (map.style && typeof map.style._loaded === 'boolean') return map.style._loaded; } catch (e) { /* نسخة مختلفة من المكتبة */ }
                    return map.isStyleLoaded();
                }
                updateMapProjects = function (projects) { (projects || []).forEach(project => renderCityMasterplan(project)); };
                updateProjectsAroundMap = function () {
                    // الخريطة لسه بتحمّل شكلها (أول فتح / تغيير قمر صناعي ↔ شوارع): نستنى ونجرب تاني
                    if (!styleReady()) {
                        clearTimeout(retryTimer);
                        if (retries++ < 60) retryTimer = setTimeout(updateProjectsAroundMap, 150);
                        return;
                    }
                    retries = 0;
                    applyPlacements();
                    // طبقة اتمسحت من بره (تغيير شكل الخريطة): تتسجل إنها مش معروضة عشان ترجع
                    MP.rendered.forEach((entry, id) => { if ((entry.coords || entry.tiles) && !map.getSource(entry.sourceId)) MP.rendered.delete(id); });
                    const zoom = map.getZoom();
                    const center = map.getCenter();
                    const activeId = S.activeProject;
                    let wanted = PROJECTS.filter(project => hasRenderableMasterplan(project) && (project.id === activeId || (zoom >= MP.MIN_ZOOM && inView(project))));
                    if (wanted.length > MP.MAX_ACTIVE) {
                        const distance = project => { const [w, s, e, n] = boundsOf(project); return Math.hypot((w + e) / 2 - center.lng, (s + n) / 2 - center.lat); };
                        wanted = wanted.sort((a, b) => (b.id === activeId) - (a.id === activeId) || distance(a) - distance(b)).slice(0, MP.MAX_ACTIVE);
                    }
                    const keep = new Set(wanted.map(project => project.id));
                    Array.from(MP.rendered.keys()).forEach(id => { if (!keep.has(id)) removeProject(id); });
                    wanted.forEach(project => renderCityMasterplan(project));
                    upgradeQuality();
                };
                MP.refresh = () => updateProjectsAroundMap();
                // بعد حفظ مكان جديد من أداة الضبط (أو تغيير الصورة): MP.reload(projectId, { masterplan_corners: [...] })
                MP.reload = function (id, changes) {
                    const project = PROJECTS.find(p => p.id == id);
                    if (!project) return;
                    Object.assign(project, changes || {});
                    if (changes && changes.masterplan) { project.masterplan = normalizeAssetUrl(changes.masterplan); project.masterplan_urls = getAssetUrlCandidates(changes.masterplan); }
                    MP.failed.delete(project.id);
                    removeProject(project.id);
                    updateProjectsAroundMap();
                };

                // فتح مدينة ما بيمسحش ماستر بلان باقي المشاريع — كل مشروع بيفضل في مكانه
                clearCityMasterplans = function () { Array.from(MP.rendered.keys()).forEach(removeProject); };
                window.showCityMasterplans = function () { updateProjectsAroundMap(); };

                window.showEnhancedMasterplan = function (projectId) {
                    const project = PROJECTS.find(p => p.id === projectId);
                    if (!project) return;
                    if (!hasRenderableMasterplan(project)) {
                        showProjectBoundaryOverlay(project, { fit: true, notify: false });
                        updateProjectPanelContent(project);
                        return;
                    }
                    removeMasterplanLayers();                              // طبقات المشروع الواحد القديمة (masterplan-layer) — ما بقتش مستخدمة
                    currentMasterplanProject = projectId;
                    MP.hidden.delete(projectId);
                    MP.failed.delete(projectId);
                    if (MP.rendered.has(projectId)) applyVisibility(projectId); else renderCityMasterplan(project);
                    masterplanVisible = true;
                    updateProjectPanelContent(project);
                    const loadingEl = document.getElementById('masterplanLoading');
                    if (loadingEl) loadingEl.classList.remove('show');
                };
                window.hideEnhancedMasterplan = function () {
                    const id = currentMasterplanProject || S.activeProject;
                    removeMasterplanLayers();
                    removeMasterplanUnitMarkers();
                    if (id != null) { MP.hidden.add(id); applyVisibility(id); }
                    const listButton = document.getElementById('mp-list-btn');
                    if (listButton) listButton.classList.remove('visible');
                    masterplanVisible = false;
                    currentMasterplanProject = null;
                    const project = S.activeProject ? PROJECTS.find(p => p.id === S.activeProject) : null;
                    if (project) updateProjectPanelContent(project);
                };
                window.toggleMasterplan = function () {
                    if (masterplanVisible) hideEnhancedMasterplan();
                    else if (S.activeProject) showEnhancedMasterplan(S.activeProject);
                };

                // أي تغيير لشكل الخريطة (قمر صناعي / شوارع) بيمسح كل الطبقات: نرجّع الماستر بلان كلها في مكانها
                map.on('style.load', () => {
                    MP.rendered.clear();
                    cityMasterplanProjectIds = [];
                    setTimeout(updateProjectsAroundMap, 80);
                });
                // احتياطي: لو الشكل اتغيّر من غير style.load (بعض نسخ المكتبة بتعدّل الشكل في مكانه)
                let styleTimer = null;
                map.on('styledata', () => { clearTimeout(styleTimer); styleTimer = setTimeout(updateProjectsAroundMap, 250); });
                map.on('zoomend', upgradeQuality);
                MP.loadPlacements();
                if (PROJECTS.length) updateProjectsAroundMap();
            })();
        </script>
    </body>
</html>
