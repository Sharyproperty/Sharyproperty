                                    <button type="button" class="smap__chip" data-smap-f="price" data-value="2" data-min="10000000" data-max="20000000" aria-pressed="false">10 – 20 مليون</button>

    <script>
/**
 * الماستر بلان على خريطة شاري التفاعلية (js/shary/map-page.js بيشغّله لوحده لو الملف ده محمّل).
 *
 * القاعدة:
 * 1) مكان الماستر بلان = اللي اتحفظ من أداة الضبط — بيتعرض زي ما هو بالظبط ، كل مرة ، على أي جهاز:
 *      masterplan_corners = 4 نقط [lng, lat] بالترتيب: أعلى-يسار الصورة ، أعلى-يمين ، أسفل-يمين ، أسفل-يسار.
 *      الترتيب ده جواه الدوران والقلب (Flip) والحجم والمكان — ممنوع إعادة ترتيب النقط أو تقريبها.
 *    المكان بييجي من واحد من اتنين (الأول بيكسب):

 * 2) كل مشروع له source / layer باسمه (masterplan-source-{id}) — مشروع ما بيمسحش مشروع.
 * 3) تغيير شكل الخريطة (قمر صناعي ⇄ خريطة) بيمسح الطبقات: بترجع كلها في مكانها لوحدها.
 * 4) الجودة: الصورة الأصلية بتتعرض من غير إعادة رسم + نسخة masterplan_hd بتتحمل من زوم hdZoom + دعم Tiles (masterplan_tiles).
 * 5) الذاكرة: بيتحمل اللي في الشاشة بس (من زوم minZoom) بحد أقصى maxActive ، والبعيد بيتشال. المشروع المختار دايمًا معروض.
 *
 * بيانات كل مشروع (كلها اختيارية ما عدا masterplan):
 *   id ، lat ، lng
 *   masterplan            لينك الصورة (PNG / WebP مفرّغة — الضلع الأكبر 2048 – 4096px)
 *   masterplan_corners    [[lng,lat] × 4]
 *   masterplan_placement  { center:[lng,lat], width_m, height_m, rotation, flip_x, flip_y }   (بديل للأركان)
 *   masterplan_hd         نسخة أعلى دقة (لحد 8192px)
 *   masterplan_tiles      'https://.../{z}/{x}/{y}.png' + masterplan_tiles_meta { bounds:[w,s,e,n], minzoom, maxzoom }
 *   masterplan_version    رقم / تاريخ آخر تعديل (بيتحط ?v= عشان الكاش)
 *   masterplan_opacity    0 – 1 (الافتراضي 1)
 *   boundary              حدود المشروع (مضلع [[lng,lat], ...] أو GeoJSON Polygon) — للمشروع اللي لسه ما اتضبطش بس
 *
 * المشروع اللي لسه ما اتضبطش (من غير أركان محفوظة): unplaced = 'bbox' بيتحط معدول جوه حدود المشروع (تقريبي لحد ما يتضبط بالأداة) ،
 *   'hide' ما بيتعرضش خالص لحد ما يتضبط.
 *
 * الاستخدام:  var mp = SharyMasterplans.attach(map, { projects: function () { return [...]; }, activeId: function () { return id; }, placementsUrl: '...' });
 *            mp.refresh()  ·  mp.reload(id, { masterplan_corners: [...] })  ·  mp.bounds(id)  ·  mp.has(id)  ·  mp.setHidden(id, true)
 */
(function () {
    var R = 6378137;
    function toMerc(p) { return [R * p[0] * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + p[1] * Math.PI / 360))]; }
    function fromMerc(p) { return [p[0] / R * 180 / Math.PI, (2 * Math.atan(Math.exp(p[1] / R)) - Math.PI / 2) * 180 / Math.PI]; }
    function deepJson(value) {
        for (var i = 0; i < 3 && typeof value === 'string'; i++) { try { value = JSON.parse(value); } catch (error) { return null; } }

    }
    function wide() { return window.innerWidth > 768; }

    // 4 نقط [lng, lat] بالترتيب TL, TR, BR, BL — من غير أي إعادة ترتيب
    function parseCorners(value) {
        var raw = deepJson(value);
        if (raw && !Array.isArray(raw) && typeof raw === 'object') raw = raw.corners || raw.coordinates || [raw.tl || raw.top_left, raw.tr || raw.top_right, raw.br || raw.bottom_right, raw.bl || raw.bottom_left];
        if (!Array.isArray(raw)) return null;
        if (raw.length === 5) raw = raw.slice(0, 4);
        if (raw.length !== 4) return null;
        var corners = raw.map(function (point) {
            if (Array.isArray(point)) return [Number(point[0]), Number(point[1])];
            if (point && typeof point === 'object') return [Number(point.lng != null ? point.lng : point.lon), Number(point.lat)];
            return [NaN, NaN];
        });
        if (!corners.every(function (c) { return isFinite(c[0]) && isFinite(c[1]) && Math.abs(c[0]) <= 180 && Math.abs(c[1]) <= 85; })) return null;
        var m = corners.map(toMerc), area = 0;
        for (var i = 0; i < 4; i++) { var a = m[i], b = m[(i + 1) % 4]; area += a[0] * b[1] - b[0] * a[1]; }

    }
    // { center:[lng,lat], width_m, height_m, rotation (درجات مع عقارب الساعة), flip_x, flip_y } ← 4 أركان
    function placementToCorners(value) {

        var width = Number(p.width_m), height = Number(p.height_m);
        if (![center[0], center[1], width, height].every(isFinite) || width <= 0 || height <= 0) return null;
        var k = 1 / Math.cos(center[1] * Math.PI / 180), hw = width * k / 2, hh = height * k / 2;
        var t = (Number(p.rotation) || 0) * Math.PI / 180, right = [Math.cos(t), -Math.sin(t)], up = [Math.sin(t), Math.cos(t)], c = toMerc(center);
        function at(sx, sy) { return fromMerc([c[0] + right[0] * hw * sx + up[0] * hh * sy, c[1] + right[1] * hw * sx + up[1] * hh * sy]); }
        var out = [at(-1, 1), at(1, 1), at(1, -1), at(-1, -1)];
        if (p.flip_x) out = [out[1], out[0], out[3], out[2]];
        if (p.flip_y) out = [out[3], out[2], out[1], out[0]];

    }
    function savedCorners(project) {
        return project ? (parseCorners(project.masterplan_corners) || placementToCorners(project.masterplan_placement)) : null;
    }
    // حدود المشروع: مضلع [[lng,lat], ...] أو GeoJSON Polygon — ولو النقط مكتوبة [lat,lng] بنعرف من مكان المشروع نفسه
    function polygonOf(project) {
        var raw = deepJson(project && project.boundary);
        if (raw && raw.type === 'Polygon' && Array.isArray(raw.coordinates)) raw = raw.coordinates[0];
        if (raw && raw.type === 'Feature' && raw.geometry && Array.isArray(raw.geometry.coordinates)) raw = raw.geometry.coordinates[0];
        if (!Array.isArray(raw) || raw.length < 3 || !raw.every(function (q) { return Array.isArray(q) && q.length >= 2; })) return null;

        if (!ring.every(function (q) { return isFinite(q[0]) && isFinite(q[1]); })) return null;
        var lat = Number(project.lat), lng = Number(project.lng);
        if (isFinite(lat) && isFinite(lng) && (lat || lng)) {
            var cx = ring.reduce(function (s, q) { return s + q[0]; }, 0) / ring.length, cy = ring.reduce(function (s, q) { return s + q[1]; }, 0) / ring.length;

        }
        return ring;
    }
    function boxOf(points) {
        var xs = points.map(function (p) { return p[0]; }), ys = points.map(function (p) { return p[1]; });
        return [Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)];
    }
    function usableImage(url) {
        url = String(url || '').trim().toLowerCase();
        if (!url || /\.pdf(\?|#|$)/.test(url)) return false;
        return !/(placeholder\.com|\/logo\.png|no-image|\/default\.)/.test(url);
    }
    function absolute(url) { try { return new URL(String(url), window.location.href).href; } catch (error) { return String(url || ''); } }

    function attach(map, options) {
        options = options || {};
        var MP = {
            minZoom: options.minZoom || 10,
            hdZoom: options.hdZoom || 15.5,
            maxActive: options.maxActive || (wide() ? 24 : 10),
            viewBuffer: options.viewBuffer || 0.5,
            unplaced: options.unplaced || 'bbox',
            rendered: {},          // id -> { token, sourceId, layerId, coords, hd, tiles, saved }
            hidden: {},
            failed: {},
            placements: {}
        };
        var maxTexture = 0, retryTimer = null, retries = 0, styleTimer = null, dead = false;
        function projects() { return (typeof options.projects === 'function' ? options.projects() : options.projects) || []; }
        function activeId() { return typeof options.activeId === 'function' ? options.activeId() : null; }
        function byId(id) { return projects().filter(function (p) { return String(p.id) === String(id); })[0] || null; }
        function ids(id) { return { sourceId: 'masterplan-source-' + id, layerId: 'masterplan-layer-' + id }; }
        function changed() { if (typeof options.onChange === 'function') options.onChange(Object.keys(MP.rendered)); }

        function textureCap() {
            if (maxTexture) return maxTexture;
            try { var gl = document.createElement('canvas').getContext('webgl'); maxTexture = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096; } catch (error) { maxTexture = 4096; }

        }
        // صورة أكبر من اللي كارت الشاشة يستحمله: بتتصغّر لأقصى مقاس مسموح (بدل ما تفشل)

                var scale = cap / Math.max(w, h), canvas = document.createElement('canvas');
                canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
                var ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/png');
            } catch (error) { return img.src; }
        }
        function loadImage(url, done) {
            var img = new Image();
            try { if (!/^(data:|blob:)/.test(url) && new URL(url, window.location.href).origin !== window.location.origin) img.crossOrigin = 'anonymous'; } catch (error) { /* لينك غريب */ }
            img.onload = function () { done(img); };
            img.onerror = function () { done(null); };
            img.src = url;
        }
        function withVersion(url, project) {
            var v = project.masterplan_version;

            return url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + encodeURIComponent(v);
        }

        // ---------- ملف الأماكن ----------
        function applyPlacements() {
            projects().forEach(function (project) {
                var item = MP.placements[project.id];

                if (project.__mpFile === undefined) project.__mpOwn = !!savedCorners(project);
                project.__mpFile = item;
                var corners = parseCorners(item.masterplan_corners || item.corners);
                if (corners && (!project.__mpOwn || item.override)) { project.masterplan_corners = corners; project.masterplan_placement = null; }
                if (item.masterplan) project.masterplan = item.masterplan;
                if (item.masterplan_hd) project.masterplan_hd = item.masterplan_hd;
                if (item.version && !project.masterplan_version) project.masterplan_version = item.version;
                if (MP.rendered[project.id]) remove(project.id);
                delete MP.failed[project.id];
            });
        }
        function loadPlacements() {
            var url = options.placementsUrl;
            if (!url || !window.fetch) return;
            fetch(url, { cache: 'no-cache' })
                .then(function (response) { return response.ok ? response.json() : null; })
                .then(function (data) {
                    if (!data || typeof data !== 'object') return;
                    MP.placements = data.projects && typeof data.projects === 'object' ? data.projects : data;
                    refresh();
                })
                .catch(function () { /* الملف مش موجود: الخريطة شغالة ببيانات المشاريع بس */ });
        }

        // ---------- مكان الصورة ----------
        function coordsFor(project, img) {
            var saved = savedCorners(project);
            if (saved) return { coords: saved, saved: true };
            if (MP.unplaced !== 'bbox') return null;
            // لسه ما اتضبطش: معدول (الشمال فوق) جوه حدود المشروع بنفس نسبة الصورة — تقريبي لحد ما يتضبط بالأداة
            var ring = polygonOf(project);
            if (!ring) return null;
            var box = boxOf(ring.map(toMerc)), w = box[2] - box[0], h = box[3] - box[1];
            if (!(w > 0) || !(h > 0)) return null;
            var ratio = img.naturalHeight / img.naturalWidth, width = Math.min(w, h / ratio), height = width * ratio;
            var cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
            return { coords: [[cx - width / 2, cy + height / 2], [cx + width / 2, cy + height / 2], [cx + width / 2, cy - height / 2], [cx - width / 2, cy - height / 2]].map(fromMerc), saved: false };
        }
        function boundsOf(project) {
            var corners = savedCorners(project);
            if (corners) return boxOf(corners);
            var entry = MP.rendered[project.id];
            if (entry && entry.coords) return boxOf(entry.coords);
            var ring = polygonOf(project);
            if (ring) return boxOf(ring);
            var lat = Number(project.lat), lng = Number(project.lng);

        }
        function inView(project) {

            var b = map.getBounds(), padLng = (b.getEast() - b.getWest()) * MP.viewBuffer, padLat = (b.getNorth() - b.getSouth()) * MP.viewBuffer;
            return box[2] >= b.getWest() - padLng && box[0] <= b.getEast() + padLng && box[3] >= b.getSouth() - padLat && box[1] <= b.getNorth() + padLat;
        }

        // ---------- الطبقات ----------
        function drop(x) {
            try {
                if (map.getLayer(x.layerId)) map.removeLayer(x.layerId);
                if (map.getSource(x.sourceId)) map.removeSource(x.sourceId);
            } catch (error) { /* الخريطة بتغيّر شكلها */ }
        }
        function remove(id) { drop(ids(id)); delete MP.rendered[id]; changed(); }
        function paintFor(project) {
            var opacity = Number(project.masterplan_opacity);

            var id = project.id, x = ids(id);

            function alive() { return !dead && MP.rendered[id] && MP.rendered[id].token === token; }
            function fail(error) { MP.failed[id] = (MP.failed[id] || 0) + 1; remove(id); if (error && window.console) console.warn('masterplan', id, error); }

            // 1) Tiles (لو السيرفر مجهّزها): أعلى جودة مع أي زوم
            var meta = deepJson(project.masterplan_tiles_meta) || {};
            if (project.masterplan_tiles && Array.isArray(meta.bounds) && meta.bounds.length === 4) {
                try {
                    drop(x);
                    map.addSource(x.sourceId, { type: 'raster', tiles: [project.masterplan_tiles], tileSize: Number(meta.tile_size) || 256, bounds: meta.bounds.map(Number), minzoom: Number(meta.minzoom) || 12, maxzoom: Number(meta.maxzoom) || 20 });

            loadImage(withVersion(absolute(project.masterplan), project), function (img) {
                if (!alive()) return;                      // المشروع اتشال أو الخريطة اتغيّر شكلها والصورة لسه بتتحمل
                if (!img) { fail('image'); return; }
                try {
                    var place = coordsFor(project, img);
                    if (!place) { MP.failed[id] = 2; remove(id); return; }      // لسه ما اتضبطش ومفيش حدود: ما يتعرضش
                    drop(x);
                    map.addSource(x.sourceId, { type: 'image', url: fitTexture(img), coordinates: place.coords });
                    map.addLayer({ id: x.layerId, type: 'raster', source: x.sourceId, paint: paintFor(project) });

                    delete MP.failed[id];
                    show(id); changed(); upgrade();
                } catch (error) {
                    // الخريطة لسه بتحمّل شكلها: مش فشل — هتترسم في المحاولة الجاية
                    if (/style/i.test(String(error && error.message))) { delete MP.rendered[id]; schedule(); } else fail(error);
                }
            });
        }
        // الجودة مع الزوم: نسخة HD
        function upgrade() {
            if (map.getZoom() < MP.hdZoom) return;
            Object.keys(MP.rendered).forEach(function (id) {
                var entry = MP.rendered[id], project = byId(id);
                if (!entry || entry.hd || entry.tiles || !entry.coords || !project || !project.masterplan_hd || !inView(project)) return;
                entry.hd = true;
                var token = entry.token;
                loadImage(withVersion(absolute(project.masterplan_hd), project), function (img) {
                    var now = MP.rendered[id];
                    if (!img || !now || now.token !== token) return;
                    try { var source = map.getSource(entry.sourceId); if (source && source.updateImage) source.updateImage({ url: fitTexture(img), coordinates: entry.coords }); } catch (error) { /* اتشالت */ }
                });
            });
        }

        // ---------- اللي في الشاشة بس ----------
        function styleReady() {
            try { if (map.style && typeof map.style._loaded === 'boolean') return map.style._loaded; } catch (error) { /* نسخة مختلفة من المكتبة */ }

        function refresh() {

            applyPlacements();
            // طبقة اتمسحت من بره (تغيير شكل الخريطة): تتسجل إنها مش معروضة عشان ترجع
            Object.keys(MP.rendered).forEach(function (id) { var entry = MP.rendered[id]; if ((entry.coords || entry.tiles) && !map.getSource(entry.sourceId)) delete MP.rendered[id]; });

            var wanted = projects().filter(function (project) {

            });
            if (wanted.length > MP.maxActive) {
                var far = function (project) { var b = boundsOf(project) || [0, 0, 0, 0]; return Math.hypot((b[0] + b[2]) / 2 - center.lng, (b[1] + b[3]) / 2 - center.lat); };
                wanted = wanted.sort(function (a, b) { return (String(b.id) === String(active)) - (String(a.id) === String(active)) || far(a) - far(b); }).slice(0, MP.maxActive);

        map.on('moveend', refresh);

        // أي تغيير لشكل الخريطة بيمسح كل الطبقات: نرجّع الماستر بلان كلها في مكانها
        map.on('style.load', function () { MP.rendered = {}; setTimeout(refresh, 80); });
        map.on('styledata', function () { clearTimeout(styleTimer); styleTimer = setTimeout(refresh, 250); });
        loadPlacements();
        refresh();

        MP.refresh = refresh;
        MP.map = map;
        MP.savedCorners = savedCorners;
        MP.has = function (id) { var entry = MP.rendered[id]; return !!(entry && (entry.coords || entry.tiles)); };
        MP.placed = function (id) { var project = byId(id); return !!(project && savedCorners(project)); };
        MP.bounds = function (id) { var project = byId(id); return project && (savedCorners(project) || polygonOf(project) || (MP.rendered[id] && MP.rendered[id].coords)) ? boundsOf(project) : null; };
        MP.setHidden = function (id, hidden) { if (hidden) MP.hidden[id] = true; else delete MP.hidden[id]; show(id); };
        // بعد حفظ مكان جديد من أداة الضبط (أو تغيير الصورة): mp.reload(id, { masterplan_corners: [...] })
        MP.reload = function (id, changes) {
            var project = byId(id);
            if (!project) return;

            var list = shown();
            if (!gl || !list.length) return;
            var wide = window.matchMedia('(min-width: 1024px)').matches;
            gl.fitBounds(bounds(list), { padding: wide ? 90 : { top: 70, right: 46, bottom: 230, left: 46 }, maxZoom: 13.5, duration: duration || 1400, essential: true });
        }

        // ---- الخريطة: الكرة الأرضية + علامة سعر لكل مشروع
        function startGL() {
            if (gl) return true;
            var lib = token ? window.mapboxgl : window.maplibregl;
            if (!lib || !lib.Map || !glBox) return false;
            try {
                if (token) lib.accessToken = token;
                glBox.hidden = false;
                glBox.setAttribute('dir', 'ltr');
                var options = { container: glBox, style: token ? MAPBOX_STYLES[state.type] : libreStyle(state.type), center: START.center, zoom: START.zoom, minZoom: -1, attributionControl: false };
                if (token) options.projection = 'globe';
                gl = new lib.Map(options);
                glLib = lib;
                if (lib.AttributionControl) gl.addControl(new lib.AttributionControl({ compact: true }), 'bottom-left');
                // Mapbox: السما ورا الكرة سحابي فاتح بدل الأسود
                if (token) gl.on('style.load', function () { try { gl.setFog({ color: '#ffffff', 'high-color': '#c3d6ee', 'space-color': '#cfe0f3', 'horizon-blend': 0.08, 'star-intensity': 0 }); } catch (e) { /* نسخة أقدم من غير الغلاف الجوي */ } });
                items.forEach(function (item) {
                    var p = info(item);
                    var pin = document.createElement('button');
                    pin.type = 'button';
                    pin.className = 'smap__marker';
                    pin.setAttribute('aria-label', p.name || '');
                    // اسم المشروع المختصر (من غير "كمبوند / قرية / Compound") جوه تابة صغيرة — السعر في الـ title
                    var label = document.createElement('span');
                    label.textContent = String(p.name || '').replace(/^(كمبوند|قرية|مشروع|Compound|Village)\s+/i, '') || priceLabel(p);
                    pin.appendChild(label);
                    pin.title = (p.name || '') + ' — ' + priceLabel(p);
                    pin.addEventListener('click', function (event) { event.stopPropagation(); select(item, true); });
                    pin.style.display = item.parentNode.hidden ? 'none' : '';
                    item.__pin = pin;
                    item.__marker = new lib.Marker({ element: pin, anchor: 'bottom' }).setLngLat([p.lng, p.lat]).addTo(gl);
                });
                // الضغط على أي مكان فاضي في الخريطة بيقفل قايمة المناطق
                gl.on('click', function () { toggleAreas(false); });
                // الماستر بلان فوق القمر الصناعي — كل مشروع في مكانه المحفوظ (المشاريع الظاهرة بعد الفلتر بس)
                if (window.SharyMasterplans) {
                    plans = window.SharyMasterplans.attach(gl, {
                        projects: function () { return shown().map(info); },
                        activeId: function () { return state.current ? info(state.current).id : null; },
                        placementsUrl: root.getAttribute('data-placements') || '',
                        unplaced: root.getAttribute('data-unplaced') || 'bbox',
                        onChange: markPlans
                    });
                    gl.on('zoom', function () { root.classList.toggle('is-close', gl.getZoom() >= 14.5); });
                }
                var started = false;
                var begin = function () { if (started) return; started = true; intro(); };
                gl.on('load', function () { window.setTimeout(begin, 350); });
                window.setTimeout(begin, 2200);   // لو صور الخريطة اتأخرت: الحركة بتبدأ برضه
                frame.hidden = true;
                root.classList.add('is-gl');
                return true;
            } catch (error) {
                gl = null;
                if (glBox) glBox.hidden = true;
                return false;
            }
        }

        // أول حركة بعد ما الخريطة تفتح: من الكرة الأرضية للمشروع / المنطقة — أو تقريب بسيط على مصر والقايمة مفتوحة
        function intro() {
            state.intro = true;
            if (state.focus && state.current) {
                var p = info(state.current);
                leaveGlobe();
                if (plans) plans.refresh();
                if (planBox(p)) goTo(p, INTRO + 600); else gl.flyTo({ center: [p.lng, p.lat], zoom: 14.5, duration: INTRO + 600, essential: true });
                return;
            }
            if (state.area) { leaveGlobe(); fitAll(INTRO); return; }
            // الكرة بتيجي من بعيد وتكبر بالراحة لحد ما تقف فوق مصر — وبعدها قايمة "اختر المنطقة" بتنزل
            gl.easeTo({ center: EGYPT, zoom: window.matchMedia('(min-width: 1024px)').matches ? 2.6 : 1.9, duration: INTRO, easing: easeOut, essential: true });
            window.setTimeout(function () { if (root.classList.contains('is-globe') && !state.area && !state.current) toggleAreas(true); }, INTRO - 1400);
        }

        // الخريطة بتتحدّث لما تبقى ظاهرة بس (ولما المشروع / النوع / التكبير يتغيّر)
        function paint(fly) {
            if (!state.live) return;
            loadLib();
            if (libState === 'loading') return;   // مستنيين المكتبة
            if (libState === 'ready' && startGL()) {
                items.forEach(function (item) { if (item.__pin) item.__pin.classList.toggle('is-on', item === state.current); });
                if (plans) plans.refresh();
                if (fly !== false && state.intro && state.current) goTo(info(state.current), 1600);
                return;
            }
            // من غير WebGL: تضمين خرائط جوجل على المشروع المختار (أو أول مشروع ظاهر)
            var item = state.current || shown()[0] || items[0];
            var q = info(item);
            frame.hidden = false;
            leaveGlobe();
            var url = 'https://www.google.com/maps?q=' + q.lat + ',' + q.lng + '&t=' + state.type + '&z=' + state.zoom + '&hl=' + lang + '&output=embed';
            if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
            frame.setAttribute('title', (root.getAttribute('data-frame-title') || '').replace(':name', q.name || ''));
        }

        function select(item, reveal) {
            state.current = item || null;
            items.forEach(function (other) { other.setAttribute('aria-current', other === item ? 'true' : 'false'); });
            if (!item) { paint(false); return; }
            if (state.intro || !gl) leaveGlobe();
            paint();
            if (reveal) {
                // الكارت المختار يبان في القايمة (بالعرض على الموبايل / بالطول على الديسك توب) من غير ما الصفحة تتحرك
                var list = item.closest('[data-smap-list]');
                var row = item.parentNode;
                if (list && list.scrollWidth > list.clientWidth + 4) list.scrollTo({ left: row.offsetLeft - (list.clientWidth - row.offsetWidth) / 2, behavior: 'smooth' });
                else if (list && list.scrollHeight > list.clientHeight + 4) list.scrollTo({ top: row.offsetTop - list.offsetTop - 8, behavior: 'smooth' });
            }
            root.dispatchEvent(new CustomEvent('shary:map-select', { bubbles: true, detail: info(item) }));
        }

        // ---- الفلترة: المنطقة + البحث + أنواع الوحدات + التسليم + السعر. لو مفيش مطابق بالظبط: بنفك الشروط واحد واحد لحد ما يبقى فيه نتيجة
        function matches(item, use) {
            var p = info(item);
            if (state.area && item.getAttribute('data-area') !== state.area) return false;
            if (use.words && use.words.length) {
                if (!item.__hay) item.__hay = plain([p.name, p.developer_name, p.area_label, p.group_label, p.location, p.slug].join(' '));
                if (!use.words.every(function (word) { return item.__hay.indexOf(word) > -1; })) return false;
            }
            if (use.types && state.types.length && !(p.type_keys || []).some(function (key) { return state.types.indexOf(key) > -1; })) return false;
            if (use.delivery && state.delivery.length && state.delivery.indexOf(String(p.delivery)) === -1) return false;
            if (use.price && state.price !== '') {
                var chip = root.querySelector('[data-smap-f="price"][data-value="' + state.price + '"]');
                var min = chip ? Number(chip.getAttribute('data-min')) : 0, max = chip ? Number(chip.getAttribute('data-max')) : 0;
                if (p.price_value < min || (max && p.price_value > max)) return false;
            }
            return true;
        }

        function filter(keep) {
            var words = plain(search && search.value).split(' ').filter(Boolean);
            var levels = [
                { words: words, types: 1, delivery: 1, price: 1 },
                { words: words, types: 1, delivery: 1 },
                { words: words, types: 1 },
                { words: words },
                {}
            ];
            var list = [], level = 0;
            for (; level < levels.length; level++) {
                list = items.filter(function (item) { return matches(item, levels[level]); });
                if (list.length) break;
            }
            if (!list.length) { list = items.slice(); }
            if (level > 0) say(root.getAttribute('data-closest'));
            items.forEach(function (item) {
                var ok = list.indexOf(item) > -1;
                item.parentNode.hidden = !ok;
                if (item.__pin) item.__pin.style.display = ok ? '' : 'none';
            });
            if (empty) empty.classList.add('hidden');
            Array.prototype.forEach.call(counts, function (count) { count.textContent = list.length; });
            if (listLink) listLink.setAttribute('href', (root.getAttribute('data-search-url') || '#') + (state.area ? '?area[]=' + state.area : ''));
            // شارات عدد الاختيارات على زراير الفلاتر
            [['types', state.types.length], ['delivery', state.delivery.length], ['price', state.price !== '' ? 1 : 0]].forEach(function (pair) {
                var badge = root.querySelector('[data-smap-fcount="' + pair[0] + '"]');
                if (badge) { badge.textContent = pair[1]; badge.hidden = !pair[1]; badge.parentNode.classList.toggle('is-set', !!pair[1]); }
            });
            var ready = root.querySelector('[data-smap-ready]');
            if (ready) ready.setAttribute('aria-pressed', state.delivery.length === 1 && state.delivery[0] === '0' ? 'true' : 'false');
            if (plans) plans.refresh();
            if (keep) return;
            if (state.current && list.indexOf(state.current) === -1) select(null);
            leaveGlobe();
            if (gl) { if (state.intro) fitAll(); }
            else { if (!state.current) select(list[0], true); else paint(); }
        }

        function setArea(slug) {
            state.area = slug;
            root.querySelectorAll('[data-smap-area]').forEach(function (chip) {
                var on = chip.getAttribute('data-smap-area') === slug;
                chip.setAttribute('aria-pressed', on ? 'true' : 'false');
                if (on && areaLabel) areaLabel.textContent = chip.getAttribute('data-label') || '';
            });
            if (areasToggle) areasToggle.classList.toggle('is-set', !!slug);
        }

        function toggleAreas(open) {
            if (!areasBox) return;
            areasBox.hidden = !open;
            if (areasVeil) areasVeil.hidden = !open;   // طبقة شفافة فوق الخريطة: الضغط على أي مكان فاضي بيقفل القايمة
            if (areasToggle) areasToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        // ---- لوحة الفلاتر: section = types | delivery | price | '' (الكل)
        function toggleSheet(open, section) {
            if (!sheet) return;
            sheet.hidden = !open;
            if (!open) return;
            toggleAreas(false);
            sheet.querySelectorAll('[data-smap-fsec]').forEach(function (part) { part.hidden = !!section && part.getAttribute('data-smap-fsec') !== section; });
        }

        function paintChips() {
            root.querySelectorAll('[data-smap-f]').forEach(function (chip) {
                var kind = chip.getAttribute('data-smap-f'), value = chip.getAttribute('data-value');
                var on = kind === 'price' ? state.price === value : state[kind].indexOf(value) > -1;
                chip.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        }

        items.forEach(function (item) {
            item.addEventListener('click', function (event) { if (!event.target.closest('a')) select(item, true); });
            item.addEventListener('keydown', function (event) { if ((event.key === 'Enter' || event.key === ' ') && event.target === item) { event.preventDefault(); select(item, true); } });
        });

        if (areasToggle) areasToggle.addEventListener('click', function () { toggleAreas(areasBox.hidden); });
        if (areasVeil) areasVeil.addEventListener('click', function () { toggleAreas(false); });
        document.addEventListener('keydown', function (event) { if (event.key === 'Escape') { toggleAreas(false); toggleSheet(false); } });
        document.addEventListener('click', function (event) {
            if (areasBox && !areasBox.hidden && !event.target.closest('[data-smap-areas], [data-smap-areas-toggle]')) toggleAreas(false);
        });
        root.querySelectorAll('[data-smap-area]').forEach(function (chip) {
            chip.addEventListener('click', function () { setArea(chip.getAttribute('data-smap-area')); toggleAreas(false); filter(); });
        });

        // زرار الرجوع: الصفحة اللي قبلها (لو جاي من صفحة في الموقع) — وإلا لينك الزرار (الرئيسية)
        var back = root.querySelector('[data-smap-back]');
        if (back) back.addEventListener('click', function (event) {
            if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.host) > -1) { event.preventDefault(); window.history.back(); }
        });

        if (search) search.addEventListener('input', function () { filter(); });

        root.querySelectorAll('[data-smap-filter-open]').forEach(function (button) {
            button.addEventListener('click', function () { toggleSheet(true, button.getAttribute('data-smap-filter-open')); });
        });
        root.querySelectorAll('[data-smap-sheet-close]').forEach(function (button) {
            button.addEventListener('click', function () { toggleSheet(false); });
        });
        root.querySelectorAll('[data-smap-f]').forEach(function (chip) {
            chip.addEventListener('click', function () {
                var kind = chip.getAttribute('data-smap-f'), value = chip.getAttribute('data-value');
                if (kind === 'price') state.price = state.price === value ? '' : value;
                else { var at = state[kind].indexOf(value); if (at > -1) state[kind].splice(at, 1); else state[kind].push(value); }
                paintChips();
                filter();
            });
        });
        var clear = root.querySelector('[data-smap-fclear]');
        if (clear) clear.addEventListener('click', function () { state.types = []; state.delivery = []; state.price = ''; paintChips(); filter(); });
        // "استلام فوري": المشاريع اللي فيها وحدات جاهزة بس
        var readyButton = root.querySelector('[data-smap-ready]');
        if (readyButton) readyButton.addEventListener('click', function () {
            state.delivery = state.delivery.length === 1 && state.delivery[0] === '0' ? [] : ['0'];
            paintChips();
            filter();
        });

        // نوع الخريطة: قمر صناعي ⇄ خريطة
        if (layersButton) layersButton.addEventListener('click', function () {
            state.type = state.type === 'h' ? 'm' : 'h';
            layersButton.setAttribute('data-type', state.type);
            layersButton.classList.toggle('is-on', state.type === 'm');
            root.classList.toggle('is-roadmap', state.type === 'm');
            if (gl) gl.setStyle(token ? MAPBOX_STYLES[state.type] : libreStyle(state.type));
            else paint();
        });

        root.querySelectorAll('[data-smap-zoom]').forEach(function (button) {
            button.addEventListener('click', function () {
                var step = Number(button.getAttribute('data-smap-zoom'));
                if (gl) { if (step > 0) gl.zoomIn(); else gl.zoomOut(); return; }
                state.zoom = Math.max(9, Math.min(20, state.zoom + step));
                paint();
            });
        });

        // "كل المشاريع في الكادر"
        var reset = root.querySelector('[data-smap-reset]');
        if (reset) reset.addEventListener('click', function () {
            toggleAreas(false);
            leaveGlobe();
            if (gl) fitAll(); else { state.zoom = 12; paint(); }
        });

        // "موقعي": الخريطة بتروح لمكان العميل (بعد إذن المتصفح)
        var locate = root.querySelector('[data-smap-locate]');
        if (locate) locate.addEventListener('click', function () {
            var fail = function () { say(root.getAttribute('data-locate-fail')); };
            if (!navigator.geolocation || !gl) { fail(); return; }
            navigator.geolocation.getCurrentPosition(function (position) {
                var here = [position.coords.longitude, position.coords.latitude];
                toggleAreas(false);
                leaveGlobe();
                if (!meMarker) { var dot = document.createElement('span'); dot.className = 'smap__me'; meMarker = new glLib.Marker({ element: dot }).setLngLat(here).addTo(gl); } else meMarker.setLngLat(here);
                gl.flyTo({ center: here, zoom: 12, duration: 2200, essential: true });
            }, fail, { enableHighAccuracy: false, timeout: 8000 });
        });

        function bySlug(slug) { return items.filter(function (item) { return item.getAttribute('data-slug') === slug; })[0]; }

        // البداية: فلتر المنطقة (لو موجود) + المشروع المطلوب (لو اللينك جاي عليه)
        if (state.area) setArea(state.area);
        if (state.focus) { state.current = bySlug(root.getAttribute('data-selected')) || null; if (state.current) state.current.setAttribute('aria-current', 'true'); }
        if (state.focus || state.area) leaveGlobe();
        filter(true);

        if ('IntersectionObserver' in window) {
            // أول ما الخريطة تظهر بتتحمل — ولو اتخفت ورجعت (صفحة واحدة بأكتر من عرض) بنظبط مقاسها
            new IntersectionObserver(function (entries) {
                if (!entries.some(function (entry) { return entry.isIntersecting; })) return;
                if (!state.live) { state.live = true; paint(); return; }
                if (gl && gl.resize) gl.resize();
            }, { rootMargin: '200px' }).observe(frame.parentNode);
        } else { state.live = true; paint(); }

        maps.push({
            root: root,
            plans: function () { return plans; },
            area: function (slug) { setArea(slug); filter(); },
            select: function (slug) {
                var item = bySlug(slug);
                if (!item) return false;
                if (item.parentNode.hidden) { if (search) search.value = ''; setArea(''); state.types = []; state.delivery = []; state.price = ''; paintChips(); filter(true); }
                toggleAreas(false);
                state.focus = true;
                select(item, true);
                return true;
            }
        });
    }

    document.querySelectorAll('[data-smap]').forEach(function (root) {
        // data-api: البيانات من الـ API الحي الأول وبعدها الخريطة — من غيره: الكروت جاية مرسومة من السيرفر
        if (root.getAttribute('data-api') && window.fetch) fromApi(root).then(function () { setup(root); });
        else setup(root);
    });

    window.SharyMap = {
        // متحكم الماستر بلان للخريطة الظاهرة (reload / refresh / has / bounds ...)
        plans: function () {
            var visible = maps.filter(function (map) { return map.root.offsetParent !== null; });
            return (visible[0] || maps[0] || { plans: function () { return null; } }).plans();
        },
        // بيفلتر الخريطة الظاهرة على منطقة (slug المنطقة الرئيسية) — '' = كل المناطق
        area: function (slug) {
            var visible = maps.filter(function (map) { return map.root.offsetParent !== null; });
            (visible.length ? visible : maps).forEach(function (map) { map.area(slug || ''); });
        },
        // بيختار المشروع في الخريطة الظاهرة (أو أول خريطة)
        select: function (slug) {
            var visible = maps.filter(function (map) { return map.root.offsetParent !== null; });
            return (visible.length ? visible : maps).some(function (map) { return map.select(slug); });
        }
    };
})();

    </script>
</body>
</html>
