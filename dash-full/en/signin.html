<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<script src="../a/preview-data-en.js"></script><script src="../a/site-links.js"></script><script src="../a/preview.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Shary</title>
<link rel="shortcut icon" href="../a/images/logo.png">
<link href="https://fonts.googleapis.com/css?family=Tajawal:400,500,700,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#123a5c;--teal:#1f9a8b;--line:#dbe4ee;--muted:#5b6b7c;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg);font-family:Tajawal,Tahoma,Arial,sans-serif;color:var(--navy)}
.side{background:linear-gradient(150deg,#123a5c,#1f6d8f 60%,#1f9a8b);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:48px;gap:14px}
.side h2{margin:0;font-size:30px;font-weight:800;line-height:1.5}
.side p{margin:0;font-size:16px;line-height:1.9;opacity:.9;max-width:42ch}
.box{display:flex;align-items:center;justify-content:center;padding:32px 20px}
form{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;display:grid;gap:16px;box-shadow:0 18px 40px -26px rgba(18,58,92,.45)}
.logo{height:38px;width:auto;justify-self:start}
h1{margin:6px 0 0;font-size:24px;font-weight:800}
.sub{margin:-8px 0 4px;color:var(--muted);font-size:15px}
label{display:grid;gap:7px;font-weight:700;font-size:14.5px}
input{height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:600 15px Tajawal,Tahoma,sans-serif;color:var(--navy);outline:none}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,154,139,.15)}
.pass{position:relative}.pass input{width:100%}
.pass button{position:absolute;inset-block:0;inset-inline-end:8px;border:0;background:none;color:var(--muted);cursor:pointer;font:700 13px Tajawal,sans-serif}
.go{height:50px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:800 16px Tajawal,Tahoma,sans-serif;cursor:pointer}
.go:hover{background:#0f2f4c}
.note{margin:0;color:var(--muted);font-size:13px;line-height:1.8;text-align:center}
@media (max-width:820px){body{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="box">
<form id="signin" action="index.html" method="get" autocomplete="on">
<img class="logo" src="../a/images/shary/shary-logo.svg" alt="Shary">
<h1>Sign In</h1>
<p class="sub">Please login to your account</p>
<label>Email<input type="email" name="email" value="admin@shary.eg" required autocomplete="username"></label>
<label>Password<span class="pass"><input type="password" name="password" value="preview-password" required autocomplete="current-password" id="pw"><button type="button" onclick="var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';">Show</button></span></label>
<button class="go" type="submit">Sign In</button>
<p class="note">You are signed out. Press «Sign In» to go back to the dashboard.</p>
</form>
</div>
<div class="side"><h2>Shary dashboard</h2><p>Projects, units, requests and the agent — the whole website and app run from one place.</p></div>
<script>
document.getElementById('signin').addEventListener('submit', function (e) {
  e.preventDefault();
  try { sessionStorage.setItem('sx-preview-note', "Welcome back ✓"); } catch (x) {}
  location.href = 'index.html';
});
</script>
</body>
</html>
