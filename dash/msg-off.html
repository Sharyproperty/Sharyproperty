<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>إيقاف الرسايل — شاري</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #EEF2F7; color: #10263F; font-family: Tahoma, Arial, sans-serif; font-weight: 700; }
        .card { width: 100%; max-width: 460px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(16, 38, 63, .08); }
        .top { background: #123A5C; padding: 16px 22px; color: #fff; font-size: 20px; font-weight: 800; }
        .top span { color: #E8A838; font-size: 14px; }
        .body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
        h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.5; }
        p { margin: 0; font-size: 15.5px; line-height: 1.8; color: #33445F; }
        form { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 15px; }
        input[type=text] { min-height: 48px; border-radius: 10px; border: 1px solid #C9D2DE; padding: 0 14px; font: inherit; font-size: 17px; direction: ltr; text-align: start; }
        input[type=text]:focus { outline: 2px solid #1D5FD1; border-color: #1D5FD1; }
        button { min-height: 46px; border-radius: 10px; border: 1px solid #DCE2EA; background: #fff; color: #10263F; font: inherit; font-size: 15.5px; font-weight: 800; cursor: pointer; }
        button.main { background: #123A5C; border-color: #123A5C; color: #fff; }
        .ok { padding: 12px 14px; border-radius: 10px; background: #E7F6F3; color: #17665B; }
        .bad { padding: 10px 12px; border-radius: 10px; background: #FDECEA; color: #A1261F; font-size: 14.5px; }
        a { color: #1D5FD1; }
    </style>
</head>
<body>
<main class="card">
    <div class="top">شاري <span>للعقارات</span></div>
    <div class="body">
                    <h1>مش عايز رسايل من شاري؟</h1>
            <p>اكتب رقم موبايلك (أو إيميلك) اللي بتوصله الرسايل، واختار:</p>
            <form method="post" action="#preview/msg/off">
                <input type="hidden" name="_token" value="preview" autocomplete="off">                <label for="off-address">رقمك أو إيميلك</label>
                <input id="off-address" type="text" name="address" value="" required autocomplete="tel" placeholder="01012345678">
                                <button class="main" name="scope" value="sms">وقّف رسايل الـ SMS بس</button>
                <button name="scope" value="all">وقّف كل الرسايل (SMS ، واتساب ، إيميل ، إشعار)</button>
            </form>
            <p style="font-size:13.5px;color:#6B7A90">بنحتفظ بعلامة على الرقم بس عشان ما يوصلوش رسايل — ومش بنستخدمه في حاجة تانية.</p>
            </div>
</main>
</body>
</html>
