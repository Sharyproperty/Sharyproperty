<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>معاينة تطبيق شاري</title>
<script>
  // على الموبايل: التطبيق نفسه بالشاشة كلها
  if (Math.min(screen.width, window.innerWidth) < 600) location.replace('app/' + location.search);
</script>
<style>
  :root { --navy:#1D4265; --teal:#08A69B; --bg:#EEF3F7; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; background:var(--bg); font-family:"Cairo",Tahoma,sans-serif; font-weight:700; color:var(--navy);
         display:flex; align-items:center; justify-content:center; gap:48px; padding:24px; flex-wrap:wrap }
  .side { max-width:340px; display:flex; flex-direction:column; gap:14px }
  h1 { margin:0; font-size:30px; font-weight:800 }
  p { margin:0; line-height:1.8; font-size:15px; color:#3d5875 }
  .tag { align-self:flex-start; background:var(--teal); color:#fff; border-radius:999px; padding:4px 14px; font-size:13px }
  a.btn { align-self:flex-start; background:var(--navy); color:#fff; text-decoration:none; border-radius:12px; padding:10px 18px; font-size:14px }
  .phone { width:400px; height:840px; background:#0F2236; border-radius:52px; padding:14px; box-shadow:0 30px 60px rgba(29,66,101,.25) }
  .phone iframe { width:100%; height:100%; border:0; border-radius:40px; background:#fff }
</style>
</head>
<body>
  <div class="phone"><iframe src="app/" title="تطبيق شاري"></iframe></div>
  <div class="side">
    <span class="tag">معاينة</span>
    <h1>تطبيق شاري</h1>
    <p>ده التطبيق نفسه، متبني من الكود ومربوط على API الموقع الجديد. البيانات اللي ظاهرة حقيقية من نسخة الاختبار.</p>
    <p>اتنقّل فيه زي الموبايل بالظبط. الطلبات اللي بتتبعت من المعاينة (فورم، حجز، تسجيل) ما بتوصلش لحد.</p>
    <a class="btn" href="app/" target="_blank" rel="noopener">افتح التطبيق بالشاشة كلها</a>
  </div>
</body>
</html>
